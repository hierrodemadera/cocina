<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cocina">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<title>Cocina</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1c1e'/%3E%3Cpath d='M18 30h28v6a14 14 0 0 1-28 0z' fill='%23fff'/%3E%3Cpath d='M26 14c-3 4 3 6 0 10M34 14c-3 4 3 6 0 10' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#ffffff;--fg:#1c1c1e;--muted:#8a8a8e;--line:#ececec;--soft:#f4f4f3;--field:#dcdcdc;
  --ok:#0a8a3f;--accent:#1c1c1e;--on-accent:#fff;--shadow:0 -6px 30px rgba(0,0,0,.14);
  --strip:#f3f3f2;--card-shadow:0 1px 2px rgba(0,0,0,.06);--card:var(--bg);--miss:#d9480f;--miss-bg:#fff1e6;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121212;--fg:#ececec;--muted:#8d8d92;--line:#262626;--soft:#1c1c1c;--field:#3a3a3a;
    --ok:#3ccf7a;--accent:#ececec;--on-accent:#121212;--shadow:0 -6px 30px rgba(0,0,0,.6);--strip:#1a1a1a;--card-shadow:none;--miss:#ff8a4c;--miss-bg:#2a1a10;}
}
html,body{background:var(--bg);color:var(--fg);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;}
body.noscroll{overflow:hidden;}
button,input,textarea{font:inherit;color:inherit;}
button{background:none;border:none;cursor:pointer;}
svg{display:block;}
.wrap{max-width:720px;margin:0 auto;padding:0 16px;}

/* ---------- cabecera ---------- */
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:var(--st);border-bottom:1px solid var(--line);}
/* color de cada grupo, como las etiquetas de Airtable */
.gp{display:inline-flex;align-items:center;max-width:100%;padding:2px 10px;border-radius:12px;background:var(--gc,#eee);color:#1c1c1e;
  font-size:13.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gc,#ddd);margin-right:6px;vertical-align:1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
/* tablero */
.board{display:flex;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;
  margin:0 calc(50% - 50vw);padding:14px 16px 0;scroll-padding-left:16px;height:70vh;}
.col{flex:1 1 0;min-width:min(72vw,240px);max-width:360px;display:flex;flex-direction:column;min-height:0;
  scroll-snap-align:start;padding:0 12px;border-left:1px solid var(--line);}
.col:first-child{border-left:none;margin-left:auto;padding-left:0;}
.col:last-child{margin-right:auto;padding-right:0;}
.top .wrap,.wide{max-width:none;}
.col-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 2px calc(90px + var(--sb));margin:0 -2px;scrollbar-width:thin;}
body.boardmode main{padding-bottom:0;}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 0 12px;flex-shrink:0;}
.col-h .c{font-size:13px;color:var(--muted);flex-shrink:0;}
.col-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:8px 0 4px;}
.col-add{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;padding:8px 4px;}
.col-add:hover{color:var(--fg);}
.rcard{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  box-shadow:var(--card-shadow);margin-bottom:8px;padding:4px 4px 4px 12px;min-height:46px;}
.rcard .open{flex:1;min-width:0;text-align:left;padding:7px 0;}
.rcard .n{display:block;font-size:15.5px;line-height:1.3;}
.rcard .sub{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12.5px;color:var(--muted);}
.rcard .sub:empty{display:none;}
.rcard .chk{width:38px;height:38px;justify-content:center;}
.rcard .chk i{width:21px;height:21px;}
.rcard .wk{margin-left:0;font-size:10px;padding:0 5px;}
.list{margin:0 calc(50% - 50vw);padding:26px 16px 0 26px;}
.list > *{max-width:560px;}
@media (min-width:700px){
  .top .wrap,.wide{padding:0 28px;}
  .tabs{margin:0 -28px;padding:0 28px;}
  .list{padding:30px 28px 0 52px;}
  .board{padding:18px 28px 0;scroll-padding-left:28px;}
  .groups{padding-top:14px;}
}
.bar{display:flex;align-items:center;gap:2px;height:50px;}
.bar h1{font-size:17px;font-weight:650;flex:1;}
/* dos espacios: Recetario y Despensa */
.space-sw{flex:1;display:flex;align-items:center;}
.space-sw > div{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;}
.space-sw button{height:32px;padding:0 13px;border-radius:8px;font-size:14.5px;font-weight:600;color:var(--muted);}
.space-sw button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1);}
html.despensa{--bg:#faf6ef;--strip:#f1ebe0;--soft:#f1ece3;--line:#e9e2d6;--card:#ffffff;}
@media (prefers-color-scheme: dark){ html.despensa{--bg:#15130f;--strip:#1c1a15;--soft:#221f19;--line:#2c2820;--card:#1d1a15;} }
html.despensa,html.despensa body,html.despensa .top{background:var(--bg);}
/* cosas de la despensa */
.rcard.item{cursor:pointer;-webkit-user-select:none;user-select:none;}
.rcard.item.missing{border-color:var(--miss);background:var(--miss-bg);}
.rcard.item .miss{display:none;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--miss);
  border:1px solid var(--miss);border-radius:6px;padding:0 6px;flex-shrink:0;}
.rcard.item.missing .miss{display:inline-block;}
.rcard .more{width:34px;height:36px;color:var(--muted);font-size:18px;flex-shrink:0;border-radius:8px;}
.col-h .zname{cursor:pointer;}
.col.addcol{flex:0 0 auto;min-width:0;max-width:none;border-left:1px dashed var(--line);}
.col.addcol button{white-space:nowrap;color:var(--muted);font-size:14px;padding:4px 6px;}
.buy-sec{margin-top:6px;}
.buy-done{margin-top:14px;height:42px;padding:0 16px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:600;}
.shop.flat{padding:0;}
.shop .from{margin-left:auto;font-size:12px;color:var(--muted);flex-shrink:0;padding-left:8px;}
.ib{width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:10px;position:relative;flex-shrink:0;}
#menu-btn{margin-right:-10px;}
.ib.on{color:var(--fg);}
.ib .badge{position:absolute;top:9px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--ok);}
.searchbox{flex:1;display:none;align-items:center;gap:8px;}
.bar.searching h1,.bar.searching .ib,.bar.searching .space-sw{display:none;}
.bar.searching .searchbox{display:flex;}
.searchbox input{flex:1;min-width:0;height:38px;padding:0 12px;border:none;border-radius:10px;background:var(--soft);font-size:16px;}
.searchbox input:focus{outline:none;}
.searchbox button{font-size:15px;color:var(--muted);padding:8px 2px 8px 6px;}
.tabstrip{background:var(--strip);border-top:1px solid var(--line);}
.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{position:relative;padding:11px 13px 10px;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;border:1px solid transparent;border-bottom:none;margin-bottom:-1px;}
.tab + .tab::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:1px;background:var(--line);}
.tab.on{color:var(--fg);background:var(--bg);border-color:var(--line);border-radius:6px 6px 0 0;}
.tab.on::before,.tab.on + .tab::before{display:none;}
.tab .n{font-size:12px;color:var(--muted);margin-left:3px;}

/* grupos: segunda fila de navegación */
.groups{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:12px 0 2px;}
.groups::-webkit-scrollbar{display:none;}
.groups.hide{display:none;}
.chip{flex-shrink:0;height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--field);font-size:14px;color:var(--muted);white-space:nowrap;}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.chip .c{opacity:.6;margin-left:4px;font-size:12.5px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.active-f{display:flex;align-items:center;gap:8px;padding:8px 0 0;font-size:13.5px;color:var(--muted);}
.active-f button{text-decoration:underline;text-underline-offset:3px;color:var(--muted);font-size:13.5px;}

/* desplegable de filtro */
#fpop{position:fixed;z-index:30;display:none;min-width:240px;max-width:calc(100vw - 24px);background:var(--bg);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:8px;}
#fpop.open{display:block;}
.fp-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 8px 4px;}
.fp-o{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 8px;border-radius:8px;font-size:15px;text-align:left;}
.fp-o:hover{background:var(--soft);}
.fp-o.on::after{content:'✓';color:var(--ok);font-weight:700;}
.fp-tags{display:flex;flex-wrap:wrap;gap:6px;padding:4px 8px 8px;}

/* ---------- lista ---------- */
main{padding-bottom:calc(96px + var(--sb));}
.ghead{display:flex;align-items:baseline;gap:8px;padding:20px 0 4px;width:100%;text-align:left;}
button.ghead{padding:20px 0 6px;}
.ghead .ch{margin-left:auto;align-self:center;color:var(--muted);transition:transform .15s;}
.ghead.closed .ch{transform:rotate(-90deg);}
.ghead.closed{border-bottom:1px solid var(--line);padding-bottom:12px;}
.ghead .t{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.ghead .c{font-size:12.5px;color:var(--muted);}
.row{display:flex;align-items:center;border-bottom:1px solid var(--line);min-height:54px;}
.chk{width:42px;height:52px;flex-shrink:0;display:flex;align-items:center;}
.chk i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--field);display:flex;align-items:center;justify-content:center;}
.chk.on i{background:var(--ok);border-color:var(--ok);}
.chk.on i::after{content:'';width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg);}
.rname{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:52px;text-align:left;padding:6px 0;}
.rname .n{font-size:16px;overflow:hidden;text-overflow:ellipsis;}
.row.done .rname .n{color:var(--muted);}
.tag{font-size:13px;color:var(--muted);white-space:nowrap;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--fg);flex-shrink:0;opacity:.5;}
.wk{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--field);border-radius:6px;padding:1px 6px;flex-shrink:0;}
.empty{padding:48px 8px;text-align:center;color:var(--muted);font-size:15px;line-height:1.7;}

.fab{position:fixed;right:20px;bottom:calc(20px + var(--sb));z-index:20;width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:var(--on-accent);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22);}
.fab.hide{display:none;}

/* ---------- semana ---------- */
.week-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0 4px;color:var(--muted);font-size:14px;}
.link{color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:8px 0;}
.card{border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden;}
.card-h{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;border-bottom:1px solid var(--line);}
.card-h .n{flex:1;min-width:0;font-weight:600;text-align:left;padding:8px 0;}
.card-h .sm{height:36px;padding:0 10px;border-radius:8px;font-size:14px;color:var(--muted);}
.card-h .sm.ok{color:var(--ok);font-weight:600;}
.card .scaler{margin:10px 14px 2px;}
.card .note{padding:12px 14px;color:var(--muted);font-size:14px;}
.shop{list-style:none;padding:2px 14px 8px;}
.shop li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.shop li:last-child{border-bottom:none;}
.shop li::before{content:'';flex-shrink:0;width:18px;height:18px;margin-top:2px;border-radius:5px;border:1.5px solid var(--field);}
.shop li.struck{color:var(--muted);text-decoration:line-through;}
.shop li.struck::before{background:var(--muted);border-color:var(--muted);}
.shop li.sub{cursor:default;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:14px;border-bottom:none;}
.shop li.sub::before{display:none;}
.shop b{font-weight:650;}

/* ---------- raciones ---------- */
.scaler{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:10px;padding:3px;font-size:14px;}
.scaler button{width:36px;height:34px;border-radius:8px;font-size:19px;}
.scaler input{width:52px;height:34px;text-align:center;border:none;background:var(--bg);border-radius:8px;font-size:16px;font-weight:600;}
.scaler .u{padding:0 8px 0 2px;color:var(--muted);}
.scaler .l{padding:0 2px 0 8px;color:var(--muted);}

/* ---------- hojas ---------- */
#sheet{position:fixed;inset:0;z-index:50;display:none;}
#sheet.open{display:block;}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.35);animation:fade .18s ease-out;}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94vh;display:flex;flex-direction:column;
  background:var(--bg);border-radius:18px 18px 0 0;box-shadow:var(--shadow);animation:up .22s cubic-bezier(.2,.8,.3,1);}
.sheet.tall{height:94vh;}
@supports (height:1dvh){.sheet{max-height:94dvh;}.sheet.tall{height:94dvh;}}
@keyframes up{from{transform:translateY(40px);opacity:.4;}to{transform:none;opacity:1;}}
@keyframes fade{from{opacity:0;}}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(680px,92vw);transform:translate(-50%,-50%);
    border-radius:18px;max-height:88vh;animation:pop .18s ease-out;}
  .sheet.tall{height:88vh;}
  @supports (height:1dvh){.sheet{max-height:88dvh;}.sheet.tall{height:88dvh;}}
  @keyframes pop{from{transform:translate(-50%,-48%);opacity:.4;}to{transform:translate(-50%,-50%);opacity:1;}}
}
.sh-head{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 6px;border-bottom:1px solid var(--line);flex-shrink:0;}
.sh-head h2{flex:1;min-width:0;font-size:17px;font-weight:650;line-height:1.3;padding:4px 0;}
.x{width:44px;height:44px;font-size:18px;color:var(--muted);flex-shrink:0;}
.sh-btn{height:38px;padding:0 14px;border-radius:10px;font-size:15px;font-weight:600;flex-shrink:0;}
.sh-btn.primary{background:var(--accent);color:var(--on-accent);}
.sh-btn.ghost{background:var(--soft);}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px calc(28px + var(--sb));flex:1;overscroll-behavior:contain;}
.pills{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.pill{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--field);font-size:14px;color:var(--muted);}
.pill.on{border-color:var(--ok);color:var(--ok);font-weight:600;}
.pill.on.wkp{border-color:var(--fg);color:var(--fg);}
.meta-line{color:var(--muted);font-size:14px;margin-top:12px;}

/* ficha técnica (lectura) */
.ficha-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px;
  padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.ficha-top .lb{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.compo{margin-top:18px;}
.compo ol{list-style:none;margin-top:6px;}
.compo li button{display:block;width:100%;text-align:left;padding:7px 0;font-size:15.5px;border-bottom:1px solid var(--line);}
.compo li button::before{content:'– ';color:var(--muted);}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.part{margin-top:30px;scroll-margin-top:12px;}
.part > h3{font-size:18px;font-weight:650;line-height:1.3;margin-bottom:12px;}
.part .lbl{display:block;margin:14px 0 4px;}
.ings{width:100%;border-collapse:collapse;}
.ings td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:15.5px;}
.ings tr:last-child td{border-bottom:none;}
.ings .q{width:1%;white-space:nowrap;text-align:right;font-weight:650;padding-right:6px;}
.ings .u{width:1%;white-space:nowrap;color:var(--muted);padding-right:12px;}
.steps{padding-left:0;list-style:none;counter-reset:s;}
.steps li{counter-increment:s;display:flex;gap:10px;padding:6px 0;font-size:15.5px;line-height:1.55;}
.steps li::before{content:counter(s) '.';flex-shrink:0;min-width:22px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;}
.prose{white-space:pre-wrap;word-wrap:break-word;font-size:15.5px;line-height:1.6;}
.foot{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap;}
.foot button{height:42px;padding:0 16px;border-radius:10px;background:var(--soft);font-size:15px;}
.foot button.danger{color:#c0392b;}

/* edición */
.f{margin-top:16px;}
.f:first-child{margin-top:0;}
.f > label,.f > .lb{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px;}
.in,.ta{width:100%;border:1px solid var(--field);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:16px;}
.in{height:46px;}
.ta{min-height:92px;resize:none;line-height:1.5;overflow:hidden;}
.in:focus,.ta:focus{outline:none;border-color:var(--fg);}
.row2{display:flex;gap:10px;}
.row2 > *{flex:1;min-width:0;}
.row2 > .f:first-child{margin-top:16px;}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;}
.seg button{flex:1;height:36px;border-radius:8px;font-size:14px;color:var(--muted);}
.seg button.on{background:var(--bg);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.epart{margin-top:22px;border:1px solid var(--line);border-radius:14px;padding:14px 12px;}
.epart-h{display:flex;gap:8px;align-items:center;}
.epart-h .in{font-weight:600;}
.epart-h .x{width:40px;height:40px;}
.irow{display:grid;grid-template-columns:58px 74px 1fr 34px;gap:6px;margin-top:6px;}
.irow .in{height:42px;padding:0 9px;font-size:15.5px;}
.irow .in.q{text-align:right;}
.irow .rm{color:var(--muted);font-size:15px;}
.ihead{display:grid;grid-template-columns:58px 74px 1fr 34px;gap:6px;font-size:11.5px;color:var(--muted);margin-top:12px;}
.ihead span:first-child{text-align:right;padding-right:9px;}
.ihead span{padding-left:9px;}
.addline{margin-top:8px;height:38px;padding:0 12px;border-radius:9px;background:var(--soft);font-size:14px;}
.addpart{margin-top:16px;width:100%;height:46px;border-radius:12px;border:1.5px dashed var(--field);color:var(--muted);font-size:15px;}

/* menú */
.mitem{display:block;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-size:16px;}

(function(){
"use strict";

/*PURE-START*/
const TABS = [
  {id:'recetas', label:'Recetas'},
  {id:'productos', label:'Productos'},
  {id:'conservas', label:'Conservas'}
];
const GROUPS = {
  recetas:   ['Salado','Dulce'],
  productos: ['Lácteos y derivados','Masas','Legumbres y semillas','Aceites, infusiones y derivados','Salsas'],
  conservas: ['Fermentos','Encurtidos','Conservas dulces','Conservas saladas']
};

/* colores de los grupos (paleta suave, como las etiquetas de Airtable) */
const GCOLOR = {
  'Salado':'#fee2d5', 'Dulce':'#ffdaf6',
  'Lácteos y derivados':'#cfdfff', 'Masas':'#d0f0fd', 'Legumbres y semillas':'#c2f5e9',
  'Aceites, infusiones y derivados':'#d1f7c4', 'Salsas':'#ffeab6',
  'Fermentos':'#ede2fe', 'Encurtidos':'#d1f7c4', 'Conservas dulces':'#ffdaf6', 'Conservas saladas':'#ffeab6'
};
function gc(g){ return GCOLOR[g] || '#eeeeee'; }
const PALETTE = ['#cfdfff','#d0f0fd','#c2f5e9','#d1f7c4','#ffeab6','#fee2d5','#ffdce5','#ffdaf6','#ede2fe'];
function tc(t){ let h = 0; for(const ch of norm(t)) h = (h*31 + ch.charCodeAt(0)) | 0; return PALETTE[Math.abs(h) % PALETTE.length]; }
function norm(s){ return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim(); }

/* ---- cantidades ---- */
const FR = '½¼¾⅓⅔⅛';
const FRV = {'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125};
const NUM = `(?:\\d+\\/\\d+|\\d+(?:[.,]\\d+)?(?:\\s?[${FR}])?|[${FR}])`;
const QRE = new RegExp(`^((?:[-•·*–−]\\s*)?(?:\\(opcional\\)\\s*|opcional:?\\s*(?:[-•]\\s*)?)?)(${NUM})(?:\\s*[–-]\\s*(${NUM}))?(?=\\s|$|[a-zA-ZáéíóúüñÁÉÍÓÚÑ%(])`, 'i');
const QONLY = new RegExp(`^(${NUM})(?:\\s*[–-]\\s*(${NUM}))?$`);
const YRE = new RegExp(`^(${NUM})\\s*(.*)$`);
const UNIT_RE = /^(kg|g|gr|grs?|mg|l|ml|cl|dl|ud\.?|uds\.?|unidad(?:es)?|cucharaditas?|cucharadas?|cdtas?\.?|cdas?\.?|tazas?|pizcas?|vasos?|dientes?|ramas?|hojas?|latas?|rodajas?|manojos?|puñados?|sobres?)(?=[\s.]|$)\.?\s*/i;

function parseNum(s){
  s = (s||'').replace(/\s/g,'');
  let m = s.match(/^(\d+)\/(\d+)$/);
  if(m) return +m[1] / +m[2];
  m = s.match(/^(\d+(?:[.,]\d+)?)?([½¼¾⅓⅔⅛])?$/);
  if(!m || (!m[1] && !m[2])) return NaN;
  return (m[1] ? parseFloat(m[1].replace(',','.')) : 0) + (m[2] ? FRV[m[2]] : 0);
}
function fmtNum(v){
  if(!isFinite(v) || v <= 0) return '0';
  const r = Math.round(v);
  if(Math.abs(v - r) < 0.03) return String(r);
  if(v < 10){
    const w = Math.floor(v), f = v - w;
    for(const [x,c] of [[.25,'¼'],[.5,'½'],[.75,'¾'],[1/3,'⅓'],[2/3,'⅔']])
      if(Math.abs(f - x) < 0.04) return (w ? w + ' ' : '') + c;
    return v.toFixed(1).replace('.', ',');
  }
  return String(r);
}
/* escala el contenido de la casilla «cantidad»; si no es un número (C/S…), lo deja igual */
function scaleQ(q, f){
  q = (q||'').trim();
  if(f === 1 || !q) return q;
  const m = q.match(QONLY);
  if(!m) return q;
  const a = parseNum(m[1]), b = m[2] ? parseNum(m[2]) : null;
  if(!isFinite(a)) return q;
  return fmtNum(a*f) + (b !== null && isFinite(b) ? '–' + fmtNum(b*f) : '');
}
function isNumQ(q){ return QONLY.test((q||'').trim()); }
function stripBullet(line){ return line.trim().replace(/^[-•·*−]\s*/,''); }
function cap(s){ return s ? s.charAt(0).toLocaleUpperCase('es') + s.slice(1) : s; }

/* una línea de texto libre («400 g de panceta») → {q, u, n} */
function parseIngLine(line){
  const t = stripBullet(line.replace(/\t/g,' '));
  if(!t) return null;
  const m = t.match(QRE);
  if(!m){
    const cs = t.match(/^(.*?)[,\s]*\b(al gusto|c\/s|cantidad suficiente)\b\.?\s*$/i);
    if(cs && cs[1].trim()) return { q:'', u:'C/S', n: cap(cs[1].trim()) };
    return { q:'', u:'', n: cap(t) };
  }
  const opt = /opcional/i.test(m[1]);
  let rest = t.slice(m[0].length).trim();
  let u = '';
  const um = rest.match(UNIT_RE);
  if(um){ u = um[1]; rest = rest.slice(um[0].length); }
  rest = rest.replace(/^de\s+/i,'').trim();
  const q = m[2].replace(/\s+/g,' ') + (m[3] ? '–' + m[3] : '');
  return { q, u, n: cap(rest) + (opt ? ' (opcional)' : '') };
}
/* una línea con casillas «400 | g | Panceta» → {q, u, n}; o texto libre */
function parseIngCell(line){
  if(line.includes('|')){
    let cells = line.split('|').map(c=> c.trim());
    if(cells[0] === '') cells.shift();
    if(cells.length && cells[cells.length-1] === '') cells.pop();
    if(!cells.length || cells.every(c=> /^:?-*:?$/.test(c))) return null;
    if(/^cant/.test(norm(cells[0]))) return null;
    if(cells.length === 1) return parseIngLine(cells[0]);
    if(cells.length === 2) return { q: cells[0], u:'', n: cap(cells[1]) };
    return { q: cells[0], u: cells[1], n: cap(cells.slice(2).join(' | ')) };
  }
  return parseIngLine(line);
}
function stepLines(text){
  return (text||'').split('\n').map(l=> l.trim().replace(/^\d+\s*[.)-]\s*/,'').replace(/^[-−•]\s*/,'').trim()).filter(Boolean);
}
function yieldInfo(y){
  const m = (y||'').trim().match(YRE);
  if(!m) return null;
  const base = parseNum(m[1]);
  return isFinite(base) && base > 0 ? { base, unit: m[2] || '' } : null;
}

/* ---- plantilla de texto (la que escribe la IA) ---- */
function normTab(v, fallback){
  const n = norm(v);
  if(n.startsWith('rece') || n.startsWith('plato')) return 'recetas';
  if(n.startsWith('produ')) return 'productos';
  if(n.startsWith('conse') || n.startsWith('ferment') || n.startsWith('encurt')) return 'conservas';
  return fallback || 'recetas';
}
function matchGroup(tab, v){
  const n = norm(v);
  if(!n) return '';
  const gs = GROUPS[tab] || [];
  return gs.find(g=> norm(g) === n)
      || gs.find(g=> norm(g).startsWith(n) || n.startsWith(norm(g).split(/[ ,]/)[0]))
      || '';
}
function trimBlock(arr){
  arr = arr.slice();
  while(arr.length && !arr[0].trim()) arr.shift();
  while(arr.length && !arr[arr.length-1].trim()) arr.pop();
  return arr.join('\n');
}
function parseTemplate(text, fallbackTab){
  const lines = (text||'').replace(/```[a-zA-Z]*/g,'').split(/\r?\n/);
  const out = [];
  let cur = null, part = null, sec = null;
  const newPart = (name)=>{ part = { name: name||'', ings:[], steps:[] }; cur.parts.push(part); return part; };
  for(const raw of lines){
    const line = raw.replace(/\s+$/,'');
    if(/^#\s+\S/.test(line)){
      cur = { name: line.replace(/^#\s+/,'').replace(/\*\*/g,'').trim(), tab:'', group:'', tag:'', yield:'', parts:[], notes:[] };
      out.push(cur); part = null; sec = null; continue;
    }
    if(!cur) continue;
    const h = line.match(/^(#{2,})\s*(.*)$/);
    if(h){
      const title = h[2].replace(/\*\*/g,'').replace(/:\s*$/,'').trim();
      const k = norm(title);
      if(k.startsWith('ingred')){ if(!part) newPart(''); sec = 'ings'; continue; }
      if(/^(elaboracion|proceso|pasos|preparacion|instrucciones|metodo)$/.test(k)){ if(!part) newPart(''); sec = 'steps'; continue; }
      if(/^(observ|nota|trucos|consejos|variantes)/.test(k)){ sec = 'notes'; continue; }
      if(/^terminado/.test(k)){ sec = 'notes'; continue; }
      if(/^(composicion|emplatado|boceto|presentacion)/.test(k)){ sec = 'skip'; continue; }
      newPart(title); sec = null; continue;
    }
    if(!sec){
      const kv = line.match(/^\s*[*-]?\s*\**([a-zA-ZñÑáéíóúÁÉÍÓÚ]+)\**\s*:\s*(.*)$/);
      if(kv){
        const k = norm(kv[1]), v = kv[2].replace(/\*\*/g,'').trim();
        if(k.startsWith('pesta') || k === 'tab' || k === 'seccion') cur.tab = v;
        else if(k.startsWith('grupo') || k.startsWith('categ') || k === 'tipo') cur.group = v;
        else if(k.startsWith('etiq') || k.startsWith('origen') || k === 'cocina') cur.tag = v;
        else if(k.startsWith('racion') || k === 'para' || k.startsWith('rinde')) cur.yield = v;
      }
      continue;
    }
    if(sec === 'skip') continue;
    if(sec === 'ings'){ if(line.trim()){ const ing = parseIngCell(line); if(ing && (ing.n || ing.q)) part.ings.push(ing); } continue; }
    if(sec === 'steps'){ part.steps.push(line); continue; }
    if(sec === 'notes') cur.notes.push(line);
  }
  return out.filter(r=> r.name).map(r=>{
    const tab = normTab(r.tab, fallbackTab);
    const parts = r.parts.map(p=> ({ name: p.name, ings: p.ings, steps: stepLines(p.steps.join('\n')).join('\n') }))
                         .filter(p=> p.name || p.ings.length || p.steps);
    return { name: r.name, tab, group: matchGroup(tab, r.group), tag: r.tag.trim(), yield: r.yield.trim(),
             parts: parts.length ? parts : [{ name:'', ings:[], steps:'' }], notes: trimBlock(r.notes) };
  });
}
function recipeToText(r){
  let s = `# ${r.name}\npestaña: ${r.tab}\n`;
  if(r.group) s += `grupo: ${r.group.toLowerCase()}\n`;
  if(r.tag) s += `etiqueta: ${r.tag}\n`;
  if(r.yield) s += `raciones: ${r.yield}\n`;
  const single = r.parts.length === 1 && !r.parts[0].name;
  r.parts.forEach(p=>{
    if(!p.ings.length && !p.steps.trim() && !p.name) return;
    const h = single ? '##' : '###';
    if(!single) s += `\n## ${p.name || 'Elaboración'}\n`;
    if(p.ings.length) s += `\n${h} Ingredientes\n` + p.ings.map(i=> `${i.q} | ${i.u} | ${i.n}`).join('\n') + '\n';
    const st = stepLines(p.steps);
    if(st.length) s += `\n${h} Elaboración\n` + st.map((x,i)=> `${i+1}. ${x}`).join('\n') + '\n';
  });
  if(r.notes.trim()) s += `\n## Observaciones\n${r.notes.trim()}\n`;
  return s;
}
/* receta del formato antiguo (ingredientes y proceso en texto) al nuevo */
function migrateOld(r){
  const parts = [];
  let p = { name:'', ings:[], steps:'' };
  (r.ingredients||'').split('\n').forEach(l=>{
    const t = l.trim(); if(!t) return;
    if(/:\s*$/.test(t) && !QRE.test(t)){
      if(p.ings.length || p.name) parts.push(p);
      p = { name: cap(t.replace(/:\s*$/,'')), ings:[], steps:'' }; return;
    }
    const ing = parseIngLine(t); if(ing) p.ings.push(ing);
  });
  parts.push(p);
  parts[0].steps = stepLines(r.process||'').join('\n');
  return parts;
}
/*PURE-END*/

const AI_PROMPT = `Eres el redactor de mi recetario. Abajo tienes mi archivo data.json. Haz lo que te pida al final y devuélveme el archivo data.json COMPLETO y actualizado: todas las recetas, también las que no cambies. Responde SOLO con el JSON, sin explicaciones ni texto alrededor.

Cada receta tiene esta forma:
{
  "id": "r-recetas-panceta-con-all-i-oli-negro",
  "tab": "recetas",
  "name": "Panceta con all i oli negro",
  "group": "Salado",
  "tag": "Cataluña",
  "yield": "4 pax",
  "parts": [
    {
      "name": "Panceta a baja temperatura",
      "ings": [
        { "q": "400", "u": "g", "n": "Panceta de cerdo" },
        { "q": "2", "u": "ud.", "n": "Diente de ajo" },
        { "q": "", "u": "C/S", "n": "Sal" }
      ],
      "steps": [
        "Mise en place de géneros y útiles.",
        "Chamuscar y raspar la piel.",
        "Cocinar a 80 ºC durante 12 h en un roner."
      ]
    }
  ],
  "notes": "Observaciones: conservación, variantes o trucos útiles.",
  "done": false
}

Reglas:
- No cambies el "id" de las recetas que ya existen. Para una receta nueva, crea un id único con el formato "r-" + pestaña + "-" + nombre en minúsculas y con guiones.
- Para modificar una receta, edítala dentro del archivo; no la dupliques. Respeta el "done" que tenga.
- "tab": "recetas" (platos con nombre propio), "productos" (elaboraciones base: masas, salsas, lácteos, bebidas…) o "conservas".
- "group": en recetas, "Salado" o "Dulce". En productos: "Lácteos y derivados", "Masas", "Legumbres y semillas", "Aceites, infusiones y derivados" o "Salsas". En conservas: "Fermentos", "Encurtidos", "Conservas dulces" o "Conservas saladas".
- "tag": región de origen (país o región: "Perú", "Japón", "Galicia"…), con mayúscula inicial. Usa exactamente el mismo nombre que ya tengan otras recetas de esa región. Si no está claro, "".
- "yield": número y unidad (4 pax, 1 l, 2 tarros…).
- "parts": una por elaboración del plato (cada componente: la carne, la salsa, el crujiente…). Si la receta es sencilla, una sola, con "name": "".
- "ings": "q" solo el número (400, 2, ½, 1,5), "u" la unidad (g, kg, ml, l, ud., cda., cdta., pizca…), "n" el ingrediente con mayúscula inicial. Cantidad suficiente: "q": "", "u": "C/S". Unidades métricas siempre que se pueda.
- "steps": pasos cortos, en infinitivo (pelar, cortar, saltear, marcar, reducir, rectificar…), con vocabulario técnico de cocina (brunoise, mirepoix, a la inglesa, napar…). El primero siempre "Mise en place de géneros y útiles.". Temperaturas y tiempos cuando importen. Sin numerar.
- "notes": observaciones útiles; si no hay, "".
- Nada de emplatado, boceto, alérgenos, costes ni calorías.
- Español de España. Sin emojis.
- El apartado "pantry" (mi despensa) déjalo exactamente como está, salvo que te pida cambiarlo.`;

/* ---------- almacenamiento ---------- */
const KEY = 'cocina_v1', UIKEY = 'cocina_ui_v2';
function uid(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
let data, ui;
function loadJSON(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){ toast('No se pudo guardar'); } }
let saveT;
function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(save, 350); }
function saveUi(){ try{ const c = Object.assign({}, ui); delete c.q; delete c.searching; localStorage.setItem(UIKEY, JSON.stringify(c)); }catch(e){} }
function validData(d){ return d && Array.isArray(d.recipes); }
function slug(s){ return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60); }
function asText(v){ return Array.isArray(v) ? v.map(x=> String(x).trim()).filter(Boolean).join('\n') : String(v||''); }
function asIng(i){
  if(Array.isArray(i)) return { q: String(i[0]||''), u: String(i[1]||''), n: String(i.slice(2).join(' ')||'') };
  if(typeof i === 'string') return parseIngCell(i) || {q:'',u:'',n:''};
  return { q: String(i.q != null ? i.q : (i.cantidad||'')), u: String(i.u != null ? i.u : (i.unidad||'')), n: String(i.n != null ? i.n : (i.ingrediente||'')) };
}
/* fromFile: las recetas sin id reciben uno fijo a partir de su nombre, para reconocerlas la próxima vez */
function cleanRecipe(r, fromFile){
  let parts = Array.isArray(r.parts) ? r.parts : migrateOld(r);
  parts = parts.map(p=>({ name: String(p.name||''), steps: stepLines(asText(p.steps)).join('\n'),
    ings: (p.ings||[]).map(i=> i && asIng(i)).filter(i=> i && (i.q || i.u || i.n)) }));
  if(!parts.length) parts = [{ name:'', ings:[], steps:'' }];
  const tab = normTab(r.tab), name = String(r.name).trim();
  return { id: r.id ? String(r.id) : (fromFile ? 'r-' + tab + '-' + slug(name) : uid()), tab, name,
           group: matchGroup(tab, r.group) || '', tag: String(r.tag||'').trim(), yield: String(r.yield||'').trim(),
           parts, notes: asText(r.notes), done: !!r.done };
}
function cleanData(d){
  const v2 = d.version >= 2;
  return {
    version: 2,
    recipes: d.recipes.filter(r=> r && r.name).map(r=> cleanRecipe(r)),
    week: Array.isArray(d.week) ? d.week.filter(w=> w && w.recipeId).map(w=>({
      id: w.id || uid(), recipeId: w.recipeId, target: typeof w.target === 'number' ? w.target : null,
      struck: v2 && Array.isArray(w.struck) ? w.struck.map(String) : [] })) : [],
    prompt: d.promptCustom && typeof d.prompt === 'string' && d.prompt.trim() ? d.prompt : AI_PROMPT,
    promptCustom: !!d.promptCustom,
    fileSync: d.fileSync && typeof d.fileSync === 'object' ? d.fileSync : {},
    syncedAt: d.syncedAt || null,
    pantry: cleanPantry(d.pantry),
    reset: d.reset || null
  };
}
const DEFAULT_ZONES = ['Nevera','Congelador','Despensa','Bodega'];
function cleanPantry(pt){
  const zones = pt && Array.isArray(pt.zones) ? pt.zones : DEFAULT_ZONES.map(n=> ({ name: n, items: [] }));
  return { zones: zones.filter(z=> z && z.name).map(z=>({
    id: z.id || uid(), name: String(z.name),
    items: (z.items||[]).filter(i=> i && i.name).map(i=>({ id: i.id || uid(), name: String(i.name), note: String(i.note||''), missing: !!i.missing, bought: !!i.bought })) })) };
}
function pantryCount(){ return data.pantry.zones.reduce((n,z)=> n + z.items.length, 0); }
/* lo que va en data.json (lo que sube a GitHub y lo que lee la IA) */
function fileData(){
  return { version: 2, reset: data.reset || undefined, recipes: data.recipes.map(r=>({
    id: r.id, tab: r.tab, name: r.name, group: r.group, tag: r.tag, yield: r.yield,
    parts: r.parts.map(p=>({ name: p.name, ings: p.ings.map(i=>({q:i.q,u:i.u,n:i.n})), steps: stepLines(p.steps) })),
    notes: r.notes, done: r.done })),
    pantry: { zones: data.pantry.zones.map(z=>({ id: z.id, name: z.name, items: z.items.map(i=>({ id: i.id, name: i.name, note: i.note, missing: i.missing })) })) } };
}
function hashRecipe(r){
  const s = JSON.stringify([r.tab, r.name, r.group, r.tag, r.yield, r.parts, r.notes]);
  let h = 0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return String(h);
}
/* aplica un data.json: lo nuevo entra, lo cambiado en el archivo se actualiza,
   lo quitado del archivo se quita. Lo hecho/no hecho y la semana siguen siendo de este dispositivo. */
function applyFile(obj){
  if(!validData(obj)) return null;
  if(obj.reset && obj.reset !== data.reset){
    data.recipes = []; data.week = []; data.fileSync = {}; data.reset = obj.reset;
  }
  const incoming = obj.recipes.filter(r=> r && r.name).map(r=> cleanRecipe(r, true));
  const prev = data.fileSync || {}, next = {};
  let added = 0, changed = 0, removed = 0;
  incoming.forEach(f=>{
    const h = hashRecipe(f); next[f.id] = h;
    let l = data.recipes.find(x=> x.id === f.id) || data.recipes.find(x=> x.tab === f.tab && norm(x.name) === norm(f.name));
    if(!l){ data.recipes.push(f); added++; return; }
    if(l.id !== f.id){ data.week.forEach(w=>{ if(w.recipeId === l.id) w.recipeId = f.id; }); l.id = f.id; }
    if(prev[f.id] !== h && hashRecipe(l) !== h){
      Object.assign(l, { tab:f.tab, name:f.name, group:f.group, tag:f.tag, yield:f.yield, parts:f.parts, notes:f.notes });
      changed++;
    }
  });
  Object.keys(prev).forEach(id=>{
    if(next[id]) return;
    if(data.recipes.some(r=> r.id === id)){ data.recipes = data.recipes.filter(r=> r.id !== id); data.week = data.week.filter(w=> w.recipeId !== id); removed++; }
  });
  // la despensa solo se toma del archivo si en este dispositivo aún está vacía
  if(obj.pantry && !pantryCount()){ const pt = cleanPantry(obj.pantry); if(pt.zones.some(z=> z.items.length)) data.pantry = pt; }
  data.fileSync = next; data.syncedAt = Date.now();
  save();
  return { added, changed, removed };
}
function syncMsg(res){
  return [res.added ? `${res.added} nueva${res.added>1?'s':''}` : '', res.changed ? `${res.changed} cambiada${res.changed>1?'s':''}` : '',
          res.removed ? `${res.removed} quitada${res.removed>1?'s':''}` : ''].filter(Boolean).join(' · ');
}

/* ---------- utilidades ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const $ = (s, el) => (el || document).querySelector(s);
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=> t.classList.remove('show'), 1900); }
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function byId(id){ return data.recipes.find(r=> r.id === id); }
function inWeek(id){ return data.week.some(w=> w.recipeId === id); }
function allIngs(r){ return r.parts.reduce((a,p)=> a.concat(p.ings), []); }
function hasContent(r){ return r.parts.some(p=> p.ings.length || p.steps.trim()) || !!r.notes.trim(); }
function grow(t){ t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }
function copyText(text, msg){
  const done = ()=> toast(msg || 'Copiado');
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, ()=> fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('No se pudo copiar'); }
  ta.remove();
}
function download(text, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(a.href), 4000);
}

/* pantalla encendida mientras miras una receta */
let wakeLock = null;
async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
    } else if(!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible' && fichaId) keepAwake(true); });

/* ============================================================
   RACIONES
   ============================================================ */
function factorFor(r, target){
  const y = yieldInfo(r.yield);
  if(target == null) return 1;
  return y ? target / y.base : target;
}
function scalerHTML(r, target, attrs){
  const y = yieldInfo(r.yield);
  const v = target == null ? (y ? y.base : 1) : target;
  return `<div class="scaler" ${attrs}><span class="l">${y?'para':'×'}</span><button data-d="-1" aria-label="menos">−</button><input inputmode="decimal" value="${fmtNum(v).replace(' ','')}" aria-label="raciones"><button data-d="1" aria-label="más">+</button><span class="u">${y?esc(y.unit):''}</span></div>`;
}
function scalerValue(sc, r, d){
  let v = parseNum(sc.querySelector('input').value.replace(/\s/g,''));
  const y = yieldInfo(r.yield);
  if(!isFinite(v) || v <= 0) v = y ? y.base : 1;
  if(d){ const st = !y ? .5 : (v <= 1 && y.base <= 2 ? .5 : 1); v = Math.max(st, Math.round((v + d*st)/st)*st); }
  return v;
}
function anyNumeric(r){ return allIngs(r).some(i=> isNumQ(i.q)); }

/* ============================================================
   SEMANA + LISTA DE LA COMPRA
   ============================================================ */
function renderWeek(main){
  data.week = data.week.filter(w=> byId(w.recipeId));
  if(!data.week.length){
    main.innerHTML = `<div class="empty">Nada para esta semana.<br>Abre una receta y pulsa <b>+ semana</b>.<br>Aquí te saldrá con su lista de la compra.</div>`;
    return;
  }
  let total = 0, struckN = 0;
  const cards = data.week.map(w=>{
    const r = byId(w.recipeId);
    const f = factorFor(r, w.target);
    const named = r.parts.filter(p=> p.ings.length).length > 1;
    let lis = '';
    r.parts.forEach((p,pi)=>{
      if(!p.ings.length) return;
      if(named) lis += `<li class="sub">${esc(p.name || 'Elaboración ' + (pi+1))}</li>`;
      p.ings.forEach((i,ii)=>{
        const k = pi + ':' + ii, s = w.struck.includes(k);
        total++; if(s) struckN++;
        const q = scaleQ(i.q, f);
        lis += `<li data-k="${k}"${s?' class="struck"':''}><span>${q?`<b>${esc(q)}</b> `:''}${i.u && i.u !== 'C/S' ? esc(i.u) + ' ' : ''}${esc(i.n)}${i.u === 'C/S' ? ' <span class="muted">(C/S)</span>' : ''}</span></li>`;
      });
    });
    return `<div class="card" data-w="${w.id}">
      <div class="card-h">
        <button class="n" data-act="open">${esc(r.name)}</button>
        <button class="sm ok" data-act="done">✓ hecha</button>
        <button class="sm" data-act="rm" aria-label="Quitar de la semana">✕</button>
      </div>
      ${lis ? (anyNumeric(r) ? scalerHTML(r, w.target, 'data-wsc') : '') + `<ul class="shop">${lis}</ul>`
            : `<div class="note">Sin ingredientes. Ábrela para añadirlos.</div>`}
    </div>`;
  }).join('');
  main.innerHTML = `<div class="week-top"><span>${data.week.length} receta${data.week.length>1?'s':''}${total?` · ${struckN}/${total} en la cesta`:''}</span>
    ${struckN?'<button class="link" data-act="unstrike">desmarcar todo</button>':''}</div>` + cards
    + `<div style="text-align:center;padding:18px 0;"><button class="link" data-act="clear">vaciar semana</button></div>`;
}
function weekClick(e){
  if(ui.tab !== 'semana' || ui.searching) return;
  const act = e.target.closest('[data-act]');
  const card = e.target.closest('.card');
  const w = card ? data.week.find(x=> x.id === card.dataset.w) : null;
  if(act && act.dataset.act === 'unstrike'){ data.week.forEach(x=> x.struck = []); save(); renderMain(); return; }
  if(act && act.dataset.act === 'clear'){
    if(!confirm('¿Quitar todas las recetas de esta semana?')) return;
    data.week = []; save(); render(); return;
  }
  if(!w) return;
  if(act){
    const a = act.dataset.act;
    if(a === 'open') openFicha(w.recipeId);
    if(a === 'rm'){ data.week = data.week.filter(x=> x !== w); save(); render(); }
    if(a === 'done'){
      const r = byId(w.recipeId); r.done = true;
      data.week = data.week.filter(x=> x !== w); save(); render(); toast(`${r.name}: hecha`);
    }
    return;
  }
  const sb = e.target.closest('.scaler button');
  if(sb){ w.target = scalerValue(sb.closest('.scaler'), byId(w.recipeId), +sb.dataset.d); save(); renderMain(); return; }
  const li = e.target.closest('li[data-k]');
  if(li){
    const k = li.dataset.k;
    w.struck = w.struck.includes(k) ? w.struck.filter(x=> x !== k) : [...w.struck, k];
    save(); renderMain();
  }
}
$('#main').addEventListener('change', e=>{
  if(ui.tab !== 'semana') return;
  const sc = e.target.closest('.scaler'), card = e.target.closest('.card');
  if(!sc || !card) return;
  const w = data.week.find(x=> x.id === card.dataset.w), r = w && byId(w.recipeId);
  if(!r) return;
  w.target = scalerValue(sc, r, 0); save(); renderMain();
});

const sheetRoot = $('#sheet');
let sheetOpen = false, pushed = false;
function openSheet(html, cls, onMount){
  closePop();
  sheetRoot.innerHTML = `<div class="backdrop"></div><div class="sheet ${cls||''}" role="dialog" aria-modal="true">${html}</div>`;
  sheetRoot.classList.add('open');
  if(!sheetOpen){ try{ history.pushState({sheet:1}, ''); pushed = true; }catch(e){} }
  sheetOpen = true;
  document.body.classList.add('noscroll');
  sheetRoot.querySelector('.backdrop').addEventListener('click', ()=> closeSheet());
  if(onMount) onMount(sheetRoot.querySelector('.sheet'));
}
function closeSheet(fromPop){
  if(!sheetOpen) return;
  flushFicha();
  sheetOpen = false; fichaId = null; keepAwake(false);
  sheetRoot.classList.remove('open'); sheetRoot.innerHTML = '';
  document.body.classList.remove('noscroll');
  if(!fromPop && pushed){ pushed = false; history.back(); } else pushed = false;
  render();
}
window.addEventListener('popstate', ()=>{ if(sheetOpen) closeSheet(true); });
document.addEventListener('keydown', e=>{ if(e.key === 'Escape'){ if(sheetOpen) closeSheet(); else closePop(); } });

let fichaId = null, fichaEdit = false, fichaTarget = null;
function openFicha(id, edit){
  const r = byId(id); if(!r) return;
  fichaId = id; fichaTarget = null;
  fichaEdit = edit != null ? edit : !hasContent(r);
  openSheet('', 'tall', sh=> drawFicha(sh));
  keepAwake(true);
}
function drawFicha(sh, keepScroll, focusSel){
  sh = sh || sheetRoot.querySelector('.sheet');
  const r = byId(fichaId); if(!r || !sh) return;
  const old = sh.querySelector('.sh-body'), top = keepScroll && old ? old.scrollTop : 0;
  sh.innerHTML = fichaEdit ? editHTML(r) : readHTML(r);
  mountFicha(sh, r);
  if(top) sh.querySelector('.sh-body').scrollTop = top;
  if(focusSel){ const el = sh.querySelector(focusSel); if(el) el.focus(); }
}
function ingTable(p, f){

}
function shownParts(r){ return r.parts.filter(p=> p.ings.length || p.steps.trim() || p.name); }

function mountFicha(sh, r){
  sh.querySelectorAll('.ta').forEach(t=> requestAnimationFrame(()=> grow(t)));
  const partOf = el => { const pe = el.closest('[data-p]'); return pe ? r.parts[+pe.dataset.p] : null; };
  sh.onclick = e=>{
    const go = e.target.closest('[data-goto]');
    if(go){ const t = sh.querySelector('#part-' + go.dataset.goto); if(t) t.scrollIntoView({behavior:'smooth', block:'start'}); return; }
    const a = e.target.closest('[data-act]');
    if(a){
      const act = a.dataset.act;
      if(act === 'close') return closeSheet();
      if(act === 'edit'){ fichaEdit = true; drawFicha(sh); return; }
      if(act === 'view'){ flushFicha(); fichaEdit = false; drawFicha(sh); return; }
      if(act === 'done'){ r.done = !r.done; save(); drawFicha(sh, true); return; }
      if(act === 'week'){
        if(inWeek(r.id)) data.week = data.week.filter(w=> w.recipeId !== r.id);
        else data.week.push({ id: uid(), recipeId: r.id, target: fichaTarget, struck: [] });
        save(); drawFicha(sh, true); renderTabs(); return;
      }
      if(act === 'copy') return copyText(recipeToText(r), 'Receta copiada como texto');
      if(act === 'delete'){
        if(!confirm(`¿Eliminar «${r.name}»? No se puede deshacer.`)) return;
        data.recipes = data.recipes.filter(x=> x !== r);
        data.week = data.week.filter(w=> w.recipeId !== r.id);
        save(); closeSheet(); toast('Eliminada'); return;
      }
      if(act === 'adding'){
        const p = partOf(a); const pi = r.parts.indexOf(p);
        p.ings.push({q:'',u:'',n:''}); save();
        drawFicha(sh, true, `[data-p="${pi}"] .irow[data-i="${p.ings.length-1}"] [data-ik="q"]`); return;
      }
      if(act === 'rming'){
        const p = partOf(a); p.ings.splice(+a.closest('.irow').dataset.i, 1); save(); drawFicha(sh, true); return;
      }
      if(act === 'addpart'){
        r.parts.push({ name:'', ings:[], steps:'' }); save();
        drawFicha(sh, true, `[data-p="${r.parts.length-1}"] [data-pk="name"]`); return;
      }
      if(act === 'rmpart'){
        const p = partOf(a);
        if((p.ings.length || p.steps.trim()) && !confirm(`¿Quitar la elaboración «${p.name || 'sin nombre'}»?`)) return;
        r.parts = r.parts.filter(x=> x !== p); save(); drawFicha(sh, true); return;
      }
    }
    const ts = e.target.closest('[data-tabset]');
    if(ts){ flushFicha(); r.tab = ts.dataset.tabset; if(!GROUPS[r.tab].includes(r.group)) r.group = ''; save(); drawFicha(sh, true); return; }
    const gs = e.target.closest('[data-groupset]');
    if(gs){
      r.group = r.group === gs.dataset.groupset ? '' : gs.dataset.groupset;
      sh.querySelectorAll('[data-groupset]').forEach(b=> b.classList.toggle('on', b.dataset.groupset === r.group));
      save(); return;
    }
    const sb = e.target.closest('[data-fsc] button');
    if(sb){ fichaTarget = scalerValue(sb.closest('.scaler'), r, +sb.dataset.d); redrawParts(sh, r); }
  };
  sh.oninput = e=>{
    const t = e.target;
    if(t.dataset.k){ r[t.dataset.k] = t.value; }
    else if(t.dataset.pk){ partOf(t)[t.dataset.pk] = t.value; }
    else if(t.dataset.ik){ partOf(t).ings[+t.closest('.irow').dataset.i][t.dataset.ik] = t.value; }
    else return;
    if(t.tagName === 'TEXTAREA') grow(t);
    saveSoon();
  };
  sh.onkeydown = e=>{
    const t = e.target;
    if(e.key === 'Enter' && t.dataset && t.dataset.ik){
      e.preventDefault();
      const p = partOf(t), pi = r.parts.indexOf(p), ii = +t.closest('.irow').dataset.i;
      if(t.dataset.ik !== 'n'){ const nx = t.nextElementSibling; if(nx && nx.tagName === 'INPUT') nx.focus(); return; }
      p.ings.splice(ii+1, 0, {q:'',u:'',n:''}); save();
      drawFicha(sh, true, `[data-p="${pi}"] .irow[data-i="${ii+1}"] [data-ik="q"]`);
    }
  };
  // pegar varias líneas en una casilla de ingrediente → una fila por línea
  sh.onpaste = e=>{
    const t = e.target;
    if(!t.dataset || !t.dataset.ik) return;
    const txt = (e.clipboardData || window.clipboardData).getData('text');
    if(!txt || !txt.includes('\n')) return;
    e.preventDefault();
    const p = partOf(t), ii = +t.closest('.irow').dataset.i;
    const rows = txt.split(/\r?\n/).map(l=> parseIngCell(l)).filter(Boolean);
    const cur = p.ings[ii];
    const empty = !cur.q && !cur.u && !cur.n;
    p.ings.splice(empty ? ii : ii+1, empty ? 1 : 0, ...rows);
    save(); drawFicha(sh, true); toast(`${rows.length} ingredientes`);
  };
  sh.onchange = e=>{
    if(e.target.closest('[data-fsc]')){ fichaTarget = scalerValue(e.target.closest('.scaler'), r, 0); redrawParts(sh, r); }
  };
  if(fichaEdit) refreshTagsDatalist();
}
function redrawParts(sh, r){
  const box = sh.querySelector('#f-parts'); if(box) box.innerHTML = partsHTML(r);
  const inp = sh.querySelector('[data-fsc] input'); if(inp) inp.value = fmtNum(fichaTarget).replace(' ','');
}
function flushFicha(){
  clearTimeout(saveT);
  const r = fichaId && byId(fichaId);
  if(r){
    r.name = r.name.trim() || 'Sin nombre'; r.tag = r.tag.trim(); r.yield = r.yield.trim();
    r.parts.forEach(p=>{ p.name = p.name.trim(); p.ings = p.ings.filter(i=> i.q.trim() || i.u.trim() || i.n.trim()).map(i=>({q:i.q.trim(),u:i.u.trim(),n:i.n.trim()})); });
    if(r.parts.length > 1) r.parts = r.parts.filter(p=> p.name || p.ings.length || p.steps.trim());
    if(!r.parts.length) r.parts = [{ name:'', ings:[], steps:'' }];
  }
  save();
}
function refreshTagsDatalist(){ $('#tags-dl').innerHTML = tagsOf(null).map(t=> `<option value="${esc(t)}">`).join(''); }

function timeAgo(t){
  if(!t) return '';
  const m = Math.round((Date.now() - t) / 60000);
  if(m < 1) return 'ahora mismo';
  if(m < 60) return `hace ${m} min`;
  const d = new Date(t);
  return d.toDateString() === new Date().toDateString() ? `hoy a las ${d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}`
    : d.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
}

function missingItems(){ const out = []; data.pantry.zones.forEach(z=> z.items.forEach(i=>{ if(i.missing) out.push({z, i}); })); return out; }
function weekShopCount(){
  let n = 0;
  data.week.forEach(w=>{ const r = byId(w.recipeId); if(!r) return; r.parts.forEach((p,pi)=> p.ings.forEach((i,ii)=>{ if(!w.struck.includes(pi+':'+ii)) n++; })); });
  return n;
}
function renderPTabs(){
  const n = missingItems().filter(x=> !x.i.bought).length + weekShopCount();
  const pt = ui.ptab === 'compra' ? 'compra' : 'lista';
  $('#tabs').innerHTML = `<button class="tab${pt==='lista'?' on':''}" data-ptab="lista">Lo que hay</button>`
    + `<button class="tab${pt==='compra'?' on':''}" data-ptab="compra">Compra${n?`<span class="n">${n}</span>`:''}</button>`;
}
function renderZones(){
  const el = $('#groups');
  if(ui.ptab === 'compra'){ el.classList.add('hide'); el.innerHTML = ''; return; }
  el.classList.remove('hide');
  const cur = curZone();
  el.innerHTML = `<button class="chip${!cur?' on':''}" data-z="">Todo</button>` +
    data.pantry.zones.map(z=>{
      const m = z.items.filter(i=> i.missing).length;
      return `<button class="chip${cur && cur.id===z.id?' on':''}" data-z="${z.id}"><span class="gdot" style="--gc:${tc(z.name)}"></span>${esc(z.name)}${m?`<span class="c" style="color:var(--miss);opacity:1;">${m}</span>`:''}</button>`;
    }).join('');
}
function itemHTML(z, i){
  return `<div class="rcard item${i.missing?' missing':''}" data-item="${i.id}" data-zone="${z.id}">
    <div class="open"><span class="n">${esc(i.name)}</span><span class="sub">${i.note?`<span>${esc(i.note)}</span>`:''}</span></div>
    <span class="miss">falta</span>
    <button class="more" data-edit aria-label="Editar">⋯</button>
  </div>`;
}
function renderPantry(){
  const main = $('#main');
  document.body.classList.remove('boardmode');
  if(ui.ptab === 'compra'){ renderBuy(main); return; }
  const cur = curZone();
  if(cur){
    main.innerHTML = `<div class="list">
      ${cur.items.length ? cur.items.map(i=> itemHTML(cur, i)).join('') : '<div class="muted" style="padding:6px 0 10px;">Aún no hay nada en esta zona.</div>'}
      <button class="col-add" data-additem="${cur.id}">+ Añadir</button>
      <p class="muted" style="margin-top:18px;">Toca una cosa cuando se acabe o quede poco: pasa a la compra.</p>
    </div>`;
    return;
  }
  const cols = data.pantry.zones.map(z=> `<section class="col">
      <div class="col-h"><span class="gp zname" data-zedit="${z.id}" style="--gc:${tc(z.name)}">${esc(z.name)}</span><span class="c">${z.items.length}</span></div>
      <div class="col-body">
        ${z.items.length ? z.items.map(i=> itemHTML(z, i)).join('') : '<div class="col-empty">Vacío</div>'}
        <button class="col-add" data-additem="${z.id}">+ Añadir</button>
      </div>
    </section>`).join('') + `<section class="col addcol"><button data-addzone>+ Zona</button></section>`;
  main.innerHTML = `<div class="board">${cols}</div>`;
  document.body.classList.add('boardmode');
  fitBoard();
}
function renderBuy(main){
  const miss = missingItems();
  const weeks = data.week.map(w=> ({ w, r: byId(w.recipeId) })).filter(x=> x.r && x.r.parts.some(p=> p.ings.length));
  if(!miss.length && !weeks.length){
    main.innerHTML = `<div class="empty">No falta nada.<br>En <b>Lo que hay</b>, toca lo que se acabe y aparecerá aquí.<br>Las recetas que metas en la Semana también traen aquí sus ingredientes.</div>`;
    return;
  }
  let html = '';
  if(miss.length){
    html += `<div class="ghead"><span class="t">De la despensa</span><span class="c">${miss.length}</span></div><ul class="shop flat">` +
      miss.map(({z,i})=> `<li data-buy="${i.id}"${i.bought?' class="struck"':''}><span>${esc(i.name)}${i.note?` <span class="muted">(${esc(i.note)})</span>`:''}</span><span class="from">${esc(z.name)}</span></li>`).join('') + `</ul>`;
    if(miss.some(x=> x.i.bought)) html += `<button class="buy-done" data-stock>Ya está en casa: quitar lo tachado</button>`;
  }
  if(weeks.length){
    html += `<div class="ghead" style="margin-top:14px;"><span class="t">De las recetas de la semana</span></div>`;
    weeks.forEach(({w, r})=>{
      const f = factorFor(r, w.target);
      html += `<div class="ghead" style="padding-top:12px;"><span style="font-weight:600;">${esc(r.name)}</span></div><ul class="shop flat">`;
      r.parts.forEach((p,pi)=> p.ings.forEach((i,ii)=>{
        const k = pi + ':' + ii, q = scaleQ(i.q, f);
        html += `<li data-wk="${w.id}" data-k="${k}"${w.struck.includes(k)?' class="struck"':''}><span>${q?`<b>${esc(q)}</b> `:''}${i.u && i.u !== 'C/S' ? esc(i.u) + ' ' : ''}${esc(i.n)}</span></li>`;
      }));
      html += `</ul>`;
    });
  }
  main.innerHTML = `<div class="list">${html}</div>`;
}
function pantryClick(e){
  const t = e.target;
  if(t.closest('[data-addzone]')) return openZone(null);
  const ze = t.closest('[data-zedit]'); if(ze) return openZone(ze.dataset.zedit);
  const ai = t.closest('[data-additem]'); if(ai) return openItem(null, ai.dataset.additem);
  const card = t.closest('[data-item]');
  if(card){
    const z = data.pantry.zones.find(x=> x.id === card.dataset.zone), i = z && z.items.find(x=> x.id === card.dataset.item);
    if(!i) return;
    if(t.closest('[data-edit]')) return openItem(i.id, z.id);
    i.missing = !i.missing; i.bought = false; save();
    keepBoard(renderPantry); renderPTabs(); renderZones();
    toast(i.missing ? `${i.name}: a la compra` : `${i.name}: hay`);
    return;
  }
  const b = t.closest('[data-buy]');
  if(b){ const x = missingItems().find(m=> m.i.id === b.dataset.buy); if(x){ x.i.bought = !x.i.bought; save(); renderPantry(); renderPTabs(); } return; }
  if(t.closest('[data-stock]')){
    let n = 0; missingItems().forEach(({i})=>{ if(i.bought){ i.missing = false; i.bought = false; n++; } });
    save(); renderPantry(); renderPTabs(); toast(`${n} de vuelta en la despensa`); return;
  }
  const wl = t.closest('[data-wk]');
  if(wl){
    const w = data.week.find(x=> x.id === wl.dataset.wk), k = wl.dataset.k;
    if(w){ w.struck = w.struck.includes(k) ? w.struck.filter(x=> x !== k) : [...w.struck, k]; save(); renderPantry(); renderPTabs(); }
  }
}
/* añadir o editar una cosa */
function openItem(itemId, zoneId){
  let zone = data.pantry.zones.find(z=> z.id === zoneId) || data.pantry.zones[0];
  if(!zone){ openZone(null); return; }
  const item = itemId ? zone.items.find(i=> i.id === itemId) : null;
  let selZone = zone.id;
  openSheet(`<div class="sh-head"><button class="x" data-act="close" aria-label="Cerrar">✕</button><h2>${item ? 'Editar' : 'Añadir a la despensa'}</h2>
      ${item ? '<button class="sh-btn primary" data-act="ok">Listo</button>' : ''}</div>
    <div class="sh-body">
      <div class="f"><input class="in" id="it-name" placeholder="Qué (aceite de oliva, huevos…)" value="${item ? esc(item.name) : ''}" autocomplete="off" enterkeyhint="done"></div>
      <div class="f"><input class="in" id="it-note" placeholder="Nota (opcional: virgen extra, de garrafa…)" value="${item ? esc(item.note) : ''}" autocomplete="off" enterkeyhint="done"></div>
      <div class="f"><span class="lb">Dónde</span><div class="chips">${data.pantry.zones.map(z=> `<button class="chip${z.id===selZone?' on':''}" data-zs="${z.id}"><span class="gdot" style="--gc:${tc(z.name)}"></span>${esc(z.name)}</button>`).join('')}</div></div>
      ${item ? `<div class="foot"><button class="danger" data-act="del">Quitar de la lista</button></div>`
             : `<div class="foot" style="margin-top:22px;"><button class="sh-btn primary" data-act="add" style="height:44px;">Añadir</button></div>
                <p class="muted" style="margin-top:14px;">Con Intro se añade y puedes escribir la siguiente.</p>`}
    </div>`, '', sh=>{
      const nm = sh.querySelector('#it-name'), nt = sh.querySelector('#it-note');
      setTimeout(()=> nm.focus(), 50);
      const commit = ()=>{
        const name = nm.value.trim();
        if(!name){ shake(nm); nm.focus(); return false; }
        const target = data.pantry.zones.find(z=> z.id === selZone);
        if(item){
          item.name = name; item.note = nt.value.trim();
          if(target && !target.items.includes(item)){ zone.items = zone.items.filter(i=> i !== item); target.items.push(item); }
        } else target.items.push({ id: uid(), name, note: nt.value.trim(), missing: false, bought: false });
        save(); return true;
      };
      const addMore = ()=>{ if(!commit()) return; toast(`Añadido: ${nm.value.trim()}`); nm.value = ''; nt.value = ''; nm.focus(); renderZones(); keepBoard(renderPantry); };
      [nm, nt].forEach(inp=> inp.addEventListener('keydown', e=>{
        if(e.key !== 'Enter') return; e.preventDefault();
        if(item){ if(commit()) closeSheet(); } else addMore();
      }));
      sh.addEventListener('click', e=>{
        const zs = e.target.closest('[data-zs]');
        if(zs){ selZone = zs.dataset.zs; sh.querySelectorAll('[data-zs]').forEach(b=> b.classList.toggle('on', b.dataset.zs === selZone)); return; }
        const a = e.target.closest('[data-act]'); if(!a) return;
        const act = a.dataset.act;
        if(act === 'close') return closeSheet();
        if(act === 'add') return addMore();
        if(act === 'ok'){ if(commit()) closeSheet(); return; }
        if(act === 'del' && confirm(`¿Quitar «${item.name}» de la lista?`)){ zone.items = zone.items.filter(i=> i !== item); save(); closeSheet(); }
      });
    });
}
/* crear, renombrar o quitar una zona */
function openZone(zoneId){
  const zone = zoneId ? data.pantry.zones.find(z=> z.id === zoneId) : null;
  openSheet(`<div class="sh-head"><button class="x" data-act="close" aria-label="Cerrar">✕</button><h2>${zone ? 'Zona' : 'Nueva zona'}</h2>
      <button class="sh-btn primary" data-act="ok">${zone ? 'Listo' : 'Crear'}</button></div>
    <div class="sh-body">
      <div class="f"><input class="in" id="z-name" placeholder="Nevera, Congelador, Especias…" value="${zone ? esc(zone.name) : ''}" autocomplete="off" enterkeyhint="done"></div>
      ${zone ? `<div class="foot"><button data-act="left">← Mover a la izquierda</button><button class="danger" data-act="del">Quitar zona</button></div>` : ''}
    </div>`, '', sh=>{
      const nm = sh.querySelector('#z-name');
      setTimeout(()=> nm.focus(), 50);
      const ok = ()=>{
        const name = nm.value.trim(); if(!name){ shake(nm); return; }
        if(zone) zone.name = name; else data.pantry.zones.push({ id: uid(), name, items: [] });
        save(); closeSheet();
      };
      nm.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); ok(); } });
      sh.addEventListener('click', e=>{
        const a = e.target.closest('[data-act]'); if(!a) return;
        const act = a.dataset.act;
        if(act === 'close') return closeSheet();
        if(act === 'ok') return ok();
        if(act === 'left'){ const zs = data.pantry.zones, i = zs.indexOf(zone); if(i > 0){ zs.splice(i,1); zs.splice(i-1,0,zone); save(); toast('Movida'); } return; }
        if(act === 'del'){
          if(zone.items.length && !confirm(`«${zone.name}» tiene ${zone.items.length} cosas. ¿Quitar la zona y todo lo que tiene?`)) return;
          data.pantry.zones = data.pantry.zones.filter(z=> z !== zone);
          if(ui.zone === zone.id) ui.zone = '';
          save(); closeSheet();
        }
      });
    });
}

/* ---------- cargar un archivo a mano ---------- */
const fileInput = document.createElement('input');
fileInput.type = 'file'; fileInput.accept = '.json,.txt,.md,application/json,text/plain,text/markdown';
fileInput.addEventListener('change', async ()=>{
  const f = fileInput.files[0]; fileInput.value = '';
  if(!f) return;
  const txt = await f.text();
  let res = null;
  try{ res = applyFile(JSON.parse(txt.replace(/^[^{]*/, '').replace(/[^}]*$/, ''))); }catch(e){}
  if(!res){
    // también vale un texto con recetas en el formato de «Copiar como texto»
    const list = parseTemplate(txt, ui.tab === 'semana' ? 'recetas' : ui.tab);
    if(!list.length){ toast('Ese archivo no tiene recetas'); return; }
    list.forEach(n=>{
      const ex = data.recipes.find(x=> x.tab === n.tab && norm(x.name) === norm(n.name));
      if(ex) Object.assign(ex, n); else data.recipes.push(Object.assign({ id: uid(), done:false }, n));
    });
    save(); res = { added: list.length, changed: 0, removed: 0 };
  }
  if(sheetOpen) closeSheet(); else render();
  toast(syncMsg(res) || 'Sin cambios');
});

/* ---------- data.json publicado (GitHub) ---------- */
let syncing = false, lastTry = 0;
async function syncFromGithub(){
  if(syncing || !/^https?:/.test(location.protocol)) return;
  syncing = true; lastTry = Date.now();
  try{
    const res = await fetch('data.json?t=' + Date.now(), {cache:'no-store'});
    if(!res.ok) return;
    const out = applyFile(await res.json());
    if(out){
      const msg = syncMsg(out);
      if(msg){ if(!sheetOpen) render(); toast('Actualizado: ' + msg); }
    }
  }catch(e){}
  finally{ syncing = false; }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && Date.now() - lastTry > 30000) syncFromGithub();
});

/* ============================================================
   ARRANQUE
   ============================================================ */
async function boot(){
  ui = Object.assign({ space:'recetario', tab:'recetas', ptab:'lista', zone:'', filter:{}, tagFilter:{}, group:{}, collapsed:{} }, loadJSON(UIKEY) || {});
  ui.q = ''; ui.searching = false;
  const stored = loadJSON(KEY);
  if(validData(stored)){
    data = cleanData(stored);
    save();
    render();
    syncFromGithub();
  } else {
    data = cleanData({ version:2, recipes:[] });
    await syncFromGithub();
    save();
    render();
  }
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
})();
