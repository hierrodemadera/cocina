/* --- elegir receta --- */
function pickRecipe(anchor){
  const all = (API.recipes ? API.recipes() : []).slice().sort((a, b)=> a.name.localeCompare(b.name, 'es'));
  const tabLabel = t=> ((API.TABS || []).find(x=> x.id === t) || {}).label || '';
  const rowsHTML = q=>{
    const n = s=> String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const qq = n(q).trim();
    const list = all.filter(r=> !qq || n(r.name).includes(qq)).slice(0, 200);
    if(!list.length) return `<p style="opacity:.6;padding:12px">${all.length ? 'Nada con ese nombre' : 'Todavía no hay recetas en el recetario'}</p>`;
    return list.map(r=>{ const d = API.DIET && API.DIET[r.diet]; return `<button class="pz-ri" data-m="${r.id}"><span class="n">${esc(r.name)}${d ? `<span class="dz" style="--dc:${d.c}">${API.dietIcon(r.diet, 14)}</span>` : ''}<small>${esc([tabLabel(r.tab), r.group].filter(Boolean).join(' · '))}</small></span></button>`; }).join('');
  };
  let placed = 0;
  openMenu(anchor, `<div style="padding:6px 6px 8px"><input class="pz-in" type="search" placeholder="Buscar receta" autocomplete="off"></div><div class="pz-list">${rowsHTML('')}</div>`,
    m=>{ const c = viewCenter(), k = 20 / V().z; addRecipe(m, { x: c.x + placed*k, y: c.y + placed*k*3 }); placed++; toast('Añadida a la pizarra'); },
    { cls: 'wide', onMount: m=>{ m.style.width = 'min(360px, calc(100vw - 20px))'; const inp = $('input', m); inp.addEventListener('input', ()=> $('.pz-list', m).innerHTML = rowsHTML(inp.value)); if(matchMedia('(pointer:fine)').matches) inp.focus(); } });
}
function askLink(it){
  const url = prompt('Dirección del enlace (https://…)', it ? it.url : 'https://');
  if(!url || url === 'https://') return;
  const u = /^https?:\/\//i.test(url) ? url : 'https://' + url;
  const title = prompt('Título (opcional)', it ? (it.title || '') : '') || '';
  if(it) change(()=>{ it.url = u; it.title = title; }); else addLink(u, title);
}

/* --- pizarras --- */
function boardsMenu(anchor){
  const list = S.boards.slice().sort((a, b)=> b.updated - a.updated);
  openMenu(anchor, `<div class="pz-mh">Pizarras</div>` + list.map(b=> `<button class="pz-mi" data-m="open:${b.id}">${b.id === B.id ? IC.check : '<span style="width:20px"></span>'}<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.name)}</span></button>`).join('') +
    `<div class="pz-msep"></div><button class="pz-mi" data-m="rename">Renombrar</button><button class="pz-mi" data-m="dup">${IC.copy}Duplicar</button><button class="pz-mi" data-m="new">${IC.newb}Nueva pizarra</button>
    <div class="pz-msep"></div><button class="pz-mi" data-m="toschema">${IC.schema}Guardar en Esquemas</button>
    <div class="pz-msep"></div><button class="pz-mi danger" data-m="del">${IC.trash}Eliminar esta pizarra</button>`,
    m=>{
      closeMenu();
      if(m.startsWith('open:')) return switchBoard(m.slice(5));
      if(m === 'rename'){ const n = prompt('Nombre de la pizarra', B.name); if(n && n.trim()){ B.name = n.trim(); save(); drawTitle(); } }
      if(m === 'dup'){ const c = clone(B); c.id = 'b' + uid(); c.name = B.name + ' (copia)'; c.created = c.updated = Date.now(); S.boards.push(c); switchBoard(c.id); }
      if(m === 'new') createBoard();
      if(m === 'toschema') toSchema();
      if(m === 'del'){
        if(!confirm(`¿Eliminar la pizarra «${B.name}»? No se puede deshacer.`)) return;
        S.boards = S.boards.filter(b=> b !== B);
        if(!S.boards.length) S.boards.push(newBoard('Pizarra'));
        switchBoard(S.boards[0].id);
      }
    });
}
function createBoard(){ const n = prompt('Nombre de la nueva pizarra', 'Sin título ' + (S.boards.length + 1)); if(n == null) return; const b = newBoard(n.trim() || 'Sin título'); S.boards.push(b); switchBoard(b.id); }
async function switchBoard(id){
  stopEdit(); saveNow();
  B = S.boards.find(b=> b.id === id) || S.boards[0]; S.cur = B.id;
  undoStack = []; redoStack = []; sel = []; sceneIdx = -1; closeScenes();
  els.forEach(el=> el.remove()); els.clear();
  await loadAssets(B);
  root.classList.toggle('dark', !!B.opts.dark);
  if(!B.view || !B.view.z){ B.view = { x: vp.clientWidth/2, y: vp.clientHeight/2, z: 1 }; }
  drawTitle(); applyView(); render(); drawSceneNav(); updateBotR(); updateUndo(); saveNow();
}
function drawTitle(){ $('#pz-title span', root).textContent = B.name; }

/* --- exportar --- */
function exportBoard(){
  const ids = new Set(B.items.filter(i=> i.t === 'img').map(i=> i.asset));
  const out = { format: 'cocina-pizarra', version: 1, board: B, assets: Object.fromEntries([...ids].map(id=> [id, assets[id]])) };
  const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (B.name || 'pizarra').replace(/[\\/:*?"<>|]/g, '') + '.pizarra.json'; a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 2000);
}
function importBoard(e){
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const d = JSON.parse(rd.result);
      if(d.format !== 'cocina-pizarra' || !d.board) throw new Error();
      Object.entries(d.assets || {}).forEach(([id, url])=>{ if(url){ assets[id] = url; idbSet('asset:' + id, url).catch(()=>{}); } });
      const b = d.board; b.id = 'b' + uid(); if(S.boards.some(x=> x.name === b.name)) b.name += ' (importada)';
      S.boards.push(b); switchBoard(b.id); toast('Pizarra importada');
    }catch(err){ toast('Ese archivo no es una pizarra'); }
  };
  rd.readAsText(f);
}
/* imprimir: la pizarra (o cada escena) ajustada a la hoja; desde ahí se guarda en PDF */
function printBoard(scenes){
  const rects = scenes && B.scenes.length ? B.scenes.slice() : [unionBox(B.items)].filter(Boolean);
  if(!rects.length){ toast('La pizarra está vacía'); return; }
  const keep = Object.assign({}, V()); setSel([]);
  const pages = rects.map(rc=>{
    const W = 1000, H = 700, z = Math.min(W / Math.max(rc.w, 1), H / Math.max(rc.h, 1)) * .94;
    return `<div class="pz-page" style="position:relative;width:${W}px;height:${H}px;overflow:hidden;page-break-after:always;break-after:page">
      <div style="position:absolute;left:0;top:0;transform-origin:0 0;transform:translate(${W/2 - (rc.x + rc.w/2)*z}px,${H/2 - (rc.y + rc.h/2)*z}px) scale(${z})">${world.innerHTML}</div></div>`;
  }).join('');
  const holder = document.createElement('div'); holder.id = 'pz-print'; holder.innerHTML = pages;
  const st = document.createElement('style'); st.textContent = `@media print{ body > *:not(#pz-print){display:none !important;} #pz-print{display:block !important;} @page{size:landscape;margin:10mm;} } @media screen{ #pz-print{display:none;} }`;
  document.body.appendChild(holder); document.body.appendChild(st);
  setTimeout(()=>{ window.print(); setTimeout(()=>{ holder.remove(); st.remove(); Object.assign(V(), keep); applyView(); }, 400); }, 60);
}
/* guardar como imagen: se dibuja todo en un lienzo */
async function exportPNG(){
  const u = unionBox(B.items); if(!u){ toast('La pizarra está vacía'); return; }
  const pad = 40, scale = Math.min(2, 4000 / Math.max(u.w + pad*2, u.h + pad*2));
  const W = Math.round((u.w + pad*2) * scale), H = Math.round((u.h + pad*2) * scale);
  // se aprovecha el propio dibujo de la pizarra metido en un SVG
  const html = `<div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:${u.w + pad*2}px;height:${u.h + pad*2}px;background:${B.opts.dark ? '#1b1b1d' : '#fff'};font-family:-apple-system,Helvetica,Arial,sans-serif">
    <style>${[...document.styleSheets].map(s=>{ try{ return [...s.cssRules].map(r=> r.cssText).filter(t=> t.includes('.pz-')).join('\n'); }catch(e){ return ''; } }).join('\n')}</style>
    <div style="position:absolute;left:0;top:0;transform:translate(${pad - u.x}px,${pad - u.y}px)">${new XMLSerializer().serializeToString(world).replace(/^<div[^>]*>|<\/div>$/g, '')}</div></div>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${u.w + pad*2} ${u.h + pad*2}"><foreignObject width="100%" height="100%">${html}</foreignObject></svg>`;
  const img = new Image();

/* --- teclado y portapapeles (ordenador o teclado del iPad) --- */
function onKey(e){
  if(!root || !root.classList.contains('open')) return;
  if(editing || /^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName) || (document.activeElement && document.activeElement.isContentEditable)) return;
  if(document.getElementById('sheet') && document.getElementById('sheet').classList.contains('open')) return;
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if(VIEW()){ if(k === 'escape'){ if($('#pz-info', root)) closeInfo(); else close(); } return; }
  if(mod && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if(mod && k === 'y'){ e.preventDefault(); redo(); return; }
  if(mod && k === 'c'){ e.preventDefault(); copySel(); return; }
  if(mod && k === 'x'){ e.preventDefault(); copySel(true); return; }
  if(mod && k === 'v'){ return; } // lo atiende el evento «paste»
  if(mod && k === 'd'){ e.preventDefault(); duplicate(); return; }
  if(mod && k === 'a'){ e.preventDefault(); setSel(B.items.map(i=> i.id)); return; }
  if(mod && (k === '+' || k === '=')){ e.preventDefault(); const r = vp.getBoundingClientRect(); zoomAt(V().z * 1.25, r.left + r.width/2, r.top + r.height/2); return; }
  if(mod && k === '-'){ e.preventDefault(); const r = vp.getBoundingClientRect(); zoomAt(V().z / 1.25, r.left + r.width/2, r.top + r.height/2); return; }
  if(k === 'escape'){ if(menuEl) closeMenu(); else if(sel.length) setSel([]); else close(); return; }
  if((k === 'backspace' || k === 'delete') && sel.length){ e.preventDefault(); delSel(); return; }
  if(k === 'enter' && sel.length === 1){ e.preventDefault(); startEdit(sel[0]); return; }
  if(k.startsWith('arrow') && sel.length){
    e.preventDefault(); const d = (e.shiftKey ? 10 : 1) / V().z, dx = k === 'arrowleft' ? -d : k === 'arrowright' ? d : 0, dy = k === 'arrowup' ? -d : k === 'arrowdown' ? d : 0;
    change(()=> selItems().forEach(it=>{ if(it.lock) return; if(isLine(it)) ['a','b'].forEach(q=>{ if(!it[q].id){ it[q].x += dx; it[q].y += dy; } }); else { it.x += dx; it.y += dy; } }));
  }
}
function onPaste(e){
  if(!root || !root.classList.contains('open') || editing || VIEW()) return;
  if(document.activeElement && (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable)) return;
  const files = [...(e.clipboardData && e.clipboardData.files || [])].filter(f=> /^image\//.test(f.type));
  if(files.length){ e.preventDefault(); files.forEach(f=> addImageFile(f)); return; }
  if(clipboard){ e.preventDefault(); paste(); return; }
  const t = e.clipboardData && e.clipboardData.getData('text/plain');
  if(t){ e.preventDefault(); if(/^https?:\/\/\S+$/.test(t.trim())) addLink(t.trim()); else { const it = addItem(placeNew({ t:'text', w:320, h:40, fs:24, text:t })); requestAnimationFrame(()=>{ const tx = els.get(it.id).querySelector('.tx'); if(tx) { it.h = tx.scrollHeight + 4; render(); } }); } }
}

/* ---------- abrir / cerrar ---------- */
async function open(){
  if(!root) build();
  await load();
  if(EXT) leaveSchema();
  root.classList.add('open'); document.body.classList.add('pz-open');
  await switchBoard(B.id);
  if(B.view.x === 0 && B.view.y === 0 && !B.items.length){ B.view = { x: vp.clientWidth/2, y: vp.clientHeight/2, z: 1 }; applyView(); }

}
function close(){

/* ================= ESQUEMAS =================
   Un esquema es una pizarra guardada en la app (data.json). Se abre en modo ver: sin herramientas,
   las flechas forman el árbol y cada caja con flechas que salen se despliega o se recoge.

  EXT = { id, mode: null, folded: new Set(), back: false };

function setMode(mode, first){

  if(EXT.mode === 'edit') saveNow();

  // lo que se ve es una copia: al ver se puede recolocar (árbol) sin tocar lo guardado
  const x = API.schemaById && API.schemaById(EXT.id);
  if(x && EXT.mode){ B.items = clone(x.board.items); B.scenes = clone(x.board.scenes || []); B.opts = clone(x.board.opts || B.opts); els.forEach(el=> el.remove()); els.clear(); }

    const t = viewFor(u), z = Math.max(t.z, .35), r = vp.getBoundingClientRect();
    const cx = t.z < .35 ? u.x + (r.width/2 - 40) / z : u.x + u.w/2;

/* pasar la pizarra abierta a Esquemas (sale de las pizarras) */
function toSchema(){
  if(!API.addSchema) return;
  if(!B.items.length){ toast('La pizarra está vacía'); return; }

/* --- árbol: las flechas entre cajas (de la que sale a la que llega) --- */
function treeKids(){
  const kids = new Map(), par = new Map();
  B.items.forEach(l=>{
    if(!isLine(l) || !(l.a && l.a.id) || !(l.b && l.b.id) || !byIdI(l.a.id) || !byIdI(l.b.id)) return;
    const [p, c] = l.sa && !l.ea ? [l.b.id, l.a.id] : [l.a.id, l.b.id];
    if(!kids.has(p)) kids.set(p, []); kids.get(p).push(c);
    if(!par.has(c)) par.set(c, []); par.get(c).push(p);
  });
  return { kids, par };
}
/* al abrir: todo recogido salvo el primer nivel (las cajas de las que no llega ninguna flecha) */
function defaultFolded(){ const { kids, par } = treeKids(); return new Set([...kids.keys()].filter(id=> par.has(id))); }
function hiddenSet(){
  const { kids } = treeKids(), hid = new Set(), stack = [];
  EXT.folded.forEach(id=> (kids.get(id) || []).forEach(k=> stack.push(k)));
  while(stack.length){ const id = stack.pop(); if(hid.has(id)) continue; hid.add(id); (kids.get(id) || []).forEach(k=> stack.push(k)); }
  // lo que también cuelga de una caja visible y abierta sigue visible
  let again = true;
  while(again){ again = false; kids.forEach((cs, p)=>{ if(hid.has(p) || EXT.folded.has(p)) return; cs.forEach(c=>{ if(hid.has(c)){ hid.delete(c); again = true; } }); }); }
  B.items.forEach(l=>{ if(isLine(l) && ((l.a && l.a.id && hid.has(l.a.id)) || (l.b && l.b.id && hid.has(l.b.id)))) hid.add(l.id); });
  return hid;
}
function countDesc(id, kids){ const seen = new Set(), st = [...(kids.get(id) || [])]; while(st.length){ const c = st.pop(); if(seen.has(c)) continue; seen.add(c); (kids.get(c) || []).forEach(k=> st.push(k)); } return seen.size; }
function foldBadges(){
  const { kids } = treeKids(), hid = hiddenSet();
  let h = '';
  kids.forEach((cs, id)=>{
    const it = byIdI(id); if(!it || hid.has(id)) return;
    // el botón va en el lado por el que salen sus flechas
    const kc = centerOf(byIdI(cs[0]) || it), side = B.opts.tree ? 'r' : bestSide(it, kc), p = sidePt(it, side), q0 = toScreen(p.x, p.y), nv = NORMAL[side];
    const q = { x: q0.x + nv.x * 16, y: q0.y + nv.y * 16 };
    const open = !EXT.folded.has(id);
    h += `<div class="pz-fold${open ? ' open' : ''}" data-h="fold:${id}" style="left:${q.x}px;top:${q.y}px">${open ? '−' : '+' + countDesc(id, kids)}</div>`;
  });
  return h;
}
function toggleFold(id){
  const { kids } = treeKids(); if(!kids.has(id)) return;
  const opening = EXT.folded.has(id);
  if(opening) EXT.folded.delete(id); else EXT.folded.add(id);
  const target = treeLayout(true);
  render();
  if(opening){
    if(target){
      // seguir lo que se abre usando dónde va a quedar
      const its = [id, ...kids.get(id)].map(k=>{ const it = byIdI(k), p = target.get(k); return it ? { x: p ? p.x : it.x, y: p ? p.y : it.y, w: it.w, h: it.h } : null; }).filter(Boolean);
      const u = unionBox(its.map(o=> Object.assign({ t: 'box' }, o))), vr = visibleRect();
      if(u && (u.x < vr.x || u.y < vr.y || u.x + u.w > vr.x + vr.w || u.y + u.h > vr.y + vr.h)){
        const t = viewFor(u, 50), z = Math.min(t.z, V().z), r = vp.getBoundingClientRect();
        animateView({ z, x: r.width/2 - (u.x + u.w/2) * z, y: r.height/2 - (u.y + u.h/2) * z });
      }
      return;
    }
    // si lo que se abre no cabe en pantalla, la vista lo acompaña (sin acercarse más de lo que estaba)
    const its = [byIdI(id), ...kids.get(id).map(byIdI)].filter(Boolean), u = unionBox(its), vr = visibleRect();
    if(u && (u.x < vr.x || u.y < vr.y || u.x + u.w > vr.x + vr.w || u.y + u.h > vr.y + vr.h)){
      const t = viewFor(u, 50), z = Math.min(t.z, V().z), r = vp.getBoundingClientRect();
      animateView({ z, x: r.width/2 - (u.x + u.w/2) * z, y: r.height/2 - (u.y + u.h/2) * z });
    }
  }
}
/* árbol automático (si el esquema lo pide): raíz a la izquierda, hijos en columnas a la derecha,
   y solo ocupa sitio lo que está desplegado. Devuelve las posiciones nuevas (y las anima). */
let layRaf = 0;
function treeLayout(animate){
  if(!VIEW() || !B.opts.tree) return null;
  const { kids, par } = treeKids();
  const ids = new Set([...kids.keys(), ...par.keys()]);
  const ord = id=> EXT.order && EXT.order.has(id) ? EXT.order.get(id) : (byIdI(id) || {}).y || 0;
  const roots = [...ids].filter(id=> !par.has(id) && byIdI(id)).sort((a, b)=> ord(a) - ord(b));
  if(!roots.length) return null;
  const depth = new Map(), q = roots.map(r=> [r, 0]);
  while(q.length){ const [id, d] = q.shift(); if(depth.has(id)) continue; depth.set(id, d); (kids.get(id) || []).forEach(k=> q.push([k, d + 1])); }
  const colW = []; depth.forEach((d, id)=>{ const it = byIdI(id); if(it) colW[d] = Math.max(colW[d] || 0, it.w); });
  const r0 = byIdI(roots[0]), colX = [r0.x]; for(let d = 1; d < colW.length; d++) colX[d] = colX[d-1] + colW[d-1] + 90;
  const pos = new Map(), done = new Set();
  const lay = (id, y)=>{
    const it = byIdI(id), d = depth.get(id); done.add(id);
    const ks = (EXT.folded.has(id) ? [] : (kids.get(id) || [])).filter(k=> !done.has(k) && depth.get(k) === d + 1 && byIdI(k)).sort((a, b)=> ord(a) - ord(b));
    if(!ks.length){ pos.set(id, { x: colX[d], y }); return it.h; }
    let cy = y, c1 = null, c2 = null;
    ks.forEach((k, i)=>{
      const hh = lay(k, cy), p = pos.get(k), kh = byIdI(k).h;
      if(c1 == null) c1 = p.y + kh/2; c2 = p.y + kh/2;
      cy += hh + (i < ks.length - 1 ? ((kids.has(k) && !EXT.folded.has(k)) || (kids.has(ks[i+1]) && !EXT.folded.has(ks[i+1])) ? 34 : 14) : 0);
    });
    const ny = Math.max(y, (c1 + c2)/2 - it.h/2);
    pos.set(id, { x: colX[d], y: ny });
    return Math.max(cy - y, ny + it.h - y);
  };
  let y = r0.y;
  roots.forEach(id=>{ y += lay(id, y) + 60; });
  // lo plegado se queda escondido detrás de su caja
  const hid = hiddenSet();
  hid.forEach(id=>{ const it = byIdI(id); if(!it || isLine(it) || pos.has(id)) return; let p = (par.get(id) || [])[0]; while(p && !pos.has(p)) p = (par.get(p) || [])[0]; const pp = p && pos.get(p); if(pp) pos.set(id, { x: pp.x, y: pp.y }); });
  cancelAnimationFrame(layRaf);
  const from = new Map(); pos.forEach((p, id)=>{ const it = byIdI(id); from.set(id, { x: it.x, y: it.y }); });
  if(!animate){ pos.forEach((p, id)=> Object.assign(byIdI(id), p)); return pos; }
  const t0 = performance.now(), ms = 240;
  const step = now=>{
    const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    pos.forEach((p, id)=>{ const it = byIdI(id), f = from.get(id); if(it){ it.x = f.x + (p.x - f.x) * e; it.y = f.y + (p.y - f.y) * e; } });
    render();
    if(k < 1) layRaf = requestAnimationFrame(step);
  };
  layRaf = requestAnimationFrame(step);
  return pos;
}
function fitVisible(instant){
  const hid = hiddenSet(), u = unionBox(B.items.filter(i=> !hid.has(i.id)));
  if(!u) return;
  const t = viewFor(u, 60); t.z = Math.min(t.z, 1.4);
  const r = vp.getBoundingClientRect(); t.x = r.width/2 - (u.x + u.w/2) * t.z; t.y = r.height/2 - (u.y + u.h/2) * t.z;
  if(instant){ Object.assign(V(), t); applyView(); } else animateView(t);
}
function viewTap(id){
  const it = byIdI(id); if(!it) return;
  const { kids } = treeKids();
  if(kids.has(id)) toggleFold(id);
  const rec = it.rid && API.byId && API.byId(it.rid);
  if(it.info || (rec && kids.has(id)) || (it.t === 'link' && kids.has(id))) return showInfo(it);

}
function itemTitle(it){

}

  const rec = it.rid && API.byId && API.byId(it.rid), r = rec ? API.byId(it.rid) : null;

  p.innerHTML = `<button class="ib-x" data-i="x">×</button><h3>${esc(itemTitle(it))}</h3>${it.info ? `<div class="ib-t">${esc(it.info)}</div>` : ''}` +

function closeInfo(){ const p = root && $('#pz-info', root); if(p) p.remove(); }
/* miniatura para la tarjeta de la pestaña Esquemas */
function thumb(board){
  const keep = B, keepX = EXT; B = { items: clone(board.items || []), opts: board.opts || {} };
  try{
    // si es un árbol, la miniatura enseña lo que se ve al abrirlo (primer nivel), ya colocado
    let hid = new Set();
    if(B.opts.tree){ EXT = { mode: 'view', folded: new Set() }; EXT.order = new Map(B.items.map(i=> [i.id, isLine(i) ? 0 : i.y])); EXT.folded = defaultFolded(); treeLayout(false); hid = hiddenSet(); }
    B.items = B.items.filter(i=> !hid.has(i.id));

    const pad = Math.max(u.w, u.h) * .04;

      const txt = label ? `<text x="${it.x + it.w/2}" y="${it.y + it.h/2}" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="${fsPx(it)}" font-weight="${it.bold ? 700 : 400}" fill="${it.color || '#1c1c1e'}">${esc(label.length > 26 ? label.slice(0, 25) + '…' : label)}</text>` : '';
      if(it.t === 'shape') return `<path transform="translate(${it.x},${it.y})" d="${shapePath(it.kind, it.w, it.h)}" fill="${it.fill||'#5ab4f0'}" stroke="${it.sw ? (it.stroke || '#1c1c1e') : 'none'}" stroke-width="${it.sw || 0}"/>` + txt;
      if(it.t === 'text') return txt;
      const fill = it.t === 'note' ? (it.fill || NOTE_COLORS[0]) : it.t === 'rec' ? (it.fill || '#fff') : '#fff';
      return `<rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" rx="${Math.min(it.w, it.h) * .12}" fill="${fill}" stroke="#c8c8cc" stroke-width="${Math.max(1, u.w/400)}"/>` + txt;
    }).join('') + `</svg>`;
  }catch(e){ return ''; }
  finally{ B = keep; EXT = keepX; }
}

/* botón en la cabecera de la app */
function addHeaderButton(){
  const menu = document.getElementById('menu-btn'); if(!menu || document.getElementById('pz-open-btn')) return;
  const b = document.createElement('button'); b.className = 'ib'; b.id = 'pz-open-btn'; b.title = 'Pizarra'; b.setAttribute('aria-label', 'Pizarra');
  b.innerHTML = IC.board; b.addEventListener('click', open);
  menu.parentNode.insertBefore(b, menu);
}
addHeaderButton();
/* ---------- añadir una receta a una pizarra desde la ficha (sin abrir la pizarra) ---------- */
async function attach(rid, anchor){
  await load();
  const r = API.byId(rid); if(!r) return;
  let host = document.getElementById('pz-attach'); if(host) host.remove();
  host = document.createElement('div'); host.id = 'pz-attach';
  const list = S.boards.slice().sort((a, b)=> b.updated - a.updated);
  host.innerHTML = `<div class="pz-dim"></div><div class="pz-menu"><div class="pz-mh">Añadir «${esc(r.name)}» a…</div>` +
    list.map(b=>{ const n = b.items.filter(i=> i.t === 'rec' && i.rid === rid).length;
      return `<button class="pz-mi" data-b="${b.id}">${IC.board}<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.name)}</span>${n ? `<small style="opacity:.55;font-size:13px">ya está${n > 1 ? ' ×' + n : ''}</small>` : ''}</button>`; }).join('') +
    `<div class="pz-msep"></div><button class="pz-mi" data-b="new">${IC.newb}Nueva pizarra…</button></div>`;
  document.body.appendChild(host);
  const m = $('.pz-menu', host), a = anchor && anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : { left: innerWidth/2, right: innerWidth/2, bottom: innerHeight/3, top: innerHeight/3 };
  const mw = m.offsetWidth, mh = m.offsetHeight;
  m.style.left = clamp((a.left + a.right)/2 - mw/2, 8, innerWidth - mw - 8) + 'px';
  m.style.top = clamp(a.bottom + 8 + mh > innerHeight - 8 ? a.top - mh - 8 : a.bottom + 8, 8, innerHeight - mh - 8) + 'px';
  const done = ()=> host.remove();
  $('.pz-dim', host).addEventListener('click', done);
  onTap(m, '[data-b]', b=>{
    let board;
    if(b.dataset.b === 'new'){
      const n = prompt('Nombre de la nueva pizarra', 'Sin título ' + (S.boards.length + 1)); if(n == null) return;
      board = newBoard(n.trim() || 'Sin título'); S.boards.push(board);
    } else board = S.boards.find(x=> x.id === b.dataset.b);
    if(!board) return;
    addToBoard(board, rid);
    done();
    if(API.toast) API.toast(`Añadida a la pizarra «${board.name}»`);
  });
}
function addToBoard(board, rid){
  const r = API.byId(rid);
  if(root && root.classList.contains('open') && board === B){ addRecipe(rid); return; }
  const v = board.view && board.view.z ? board.view : { x: innerWidth/2, y: innerHeight/2, z: 1 };
  const k = clamp(1 / v.z, 1, 4), w = 240*k, h = 60*k;
  const c = { x: (innerWidth/2 - v.x) / v.z, y: (innerHeight/2 - v.y) / v.z };
  const it = { id: 'i' + uid(), t: 'rec', rid, name: r ? r.name : '', w, h, x: c.x - w/2, y: c.y - h/2 };
  // si ya hay algo justo ahí, la nueva va debajo, como una lista
  for(let n = 0; n < 40 && board.items.some(o=> !isLine(o) && o.t !== 'ink' && Math.abs(o.x - it.x) < w*.5 && Math.abs(o.y - it.y) < h*.8); n++) it.y += h + 12*k;
  board.items.push(it); board.updated = Date.now();
  if(board === B){ undoStack = []; redoStack = []; }
  saveNow();
}
window.pizarra = { open, close, attach, schema, thumb };
})();
