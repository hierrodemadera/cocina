/* ============================================================
   DESPENSA: lo que siempre tiene que haber
   ============================================================ */
function curZone(){ return data.pantry.zones.find(z=> z.id === ui.zone) || null; }
function missingItems(){ const out = []; data.pantry.zones.forEach(z=> z.items.forEach(i=>{ if(i.missing) out.push({z, i}); })); return out; }
function weekShopCount(){
  let n = 0;
  data.week.forEach(w=>{ const r = byId(w.recipeId); if(!r) return; r.parts.forEach((p,pi)=> p.ings.forEach((i,ii)=>{ if(!w.struck.includes(pi+':'+ii)) n++; })); });
  return n;
}
function renderPTabs(){
  const n = missingItems().filter(x=> !x.i.bought).length + weekShopCount() + (data.pantry.extra || []).filter(x=> !x.bought).length;
  const pt = ui.ptab, nw = data.week.length;
  $('#tabs').innerHTML = `<button class="tab${pt==='lista'?' on':''}" data-ptab="lista">Stock</button>`
    + `<button class="tab${pt==='compra'?' on':''}" data-ptab="compra">Compra${n?`<span class="n">${n}</span>`:''}</button>`;
}
function renderZones(){
  const el = $('#groups');
  if(ui.ptab !== 'lista'){ el.classList.add('hide'); el.innerHTML = ''; return; }
  el.classList.remove('hide');
  const cur = curZone();
  el.innerHTML = `<button class="chip${!cur?' on':''}" data-z="">Todo</button>` +
    data.pantry.zones.map(z=>{
      const m = z.items.filter(i=> i.missing).length;
      return `<button class="chip${cur && cur.id===z.id?' on':''}" data-z="${z.id}"><span class="gdot" style="--gc:${tc(z.name)}"></span>${esc(z.name)}${m?`<span class="c" style="color:var(--miss);opacity:1;">${m}</span>`:''}</button>`;
    }).join('');
}
/* cosas de una zona agrupadas: primero las sueltas y luego cada grupo, plegable */
function zoneItems(z){
  const loose = z.items.filter(i=> !i.group), groups = [];
  z.items.forEach(i=>{ if(i.group && !groups.includes(i.group)) groups.push(i.group); });
  return loose.map(i=> itemHTML(z, i)).join('') + groups.map(g=>{
    const its = z.items.filter(i=> i.group === g), k = 'p:' + z.id + ':' + g, open = subOpen(k), m = its.filter(i=> i.missing).length;
    return `<div class="col-sub tog${open?' open':''}" data-sub="${esc(k)}"><span class="chev"></span>${esc(g)}<span class="c">${its.length}</span>${m?`<span class="c" style="color:var(--miss);opacity:1;">· ${m} falta${m>1?'n':''}</span>`:''}</div>`
      + (open ? its.map(i=> itemHTML(z, i)).join('') : '');
  }).join('');
}
function itemHTML(z, i){
  return `<div class="rcard item${i.missing?' missing':''}" data-item="${i.id}" data-zone="${z.id}">
    <div class="open"><span class="n">${esc(i.name)}</span><span class="sub">${i.note?`<span>${esc(i.note)}</span>`:''}</span></div>
    <span class="miss">falta</span>
    <button class="more" data-edit aria-label="Editar">⋯</button>
  </div>`;
}
function renderPantry(){
  const main = $('#main');
  document.body.classList.remove('boardmode');
  if(ui.ptab === 'compra'){ renderBuy(main); return; }
  if(ui.ptab === 'semana'){ renderWeek(main); return; }
  const cur = curZone();
  if(cur){
    main.innerHTML = `<div class="list">
      ${cur.items.length ? zoneItems(cur) : '<div class="muted" style="padding:6px 0 10px;">Aún no hay nada en esta zona.</div>'}
      <button class="col-add" data-additem="${cur.id}">+ Añadir</button>
      <p class="muted" style="margin-top:18px;">Toca una cosa cuando se acabe o quede poco: pasa a la compra.</p>
    </div>`;
    return;
  }
  const cols = data.pantry.zones.map(z=> `<section class="col">
      <div class="col-h"><span class="gp zname" data-zedit="${z.id}" style="--gc:${tc(z.name)}">${esc(z.name)}</span><span class="c">${z.items.length}</span></div>
      <div class="col-body">
        ${z.items.length ? zoneItems(z) : '<div class="col-empty">Vacío</div>'}
        <button class="col-add" data-additem="${z.id}">+ Añadir</button>
      </div>
    </section>`).join('') + `<section class="col addcol"><button data-addzone>+ Zona</button></section>`;
  main.innerHTML = `<div class="board">${cols}</div>`;
  document.body.classList.add('boardmode');
  fitBoard();
}
function renderBuy(main){
  const miss = missingItems();
  data.week = data.week.filter(w=> byId(w.recipeId));
  const weeks = data.week.map(w=> ({ w, r: byId(w.recipeId) }));
  const extra = data.pantry.extra || [];
  let html = '';
  if(!miss.length && !weeks.length)
    html += `<div class="empty" style="padding:28px 0 18px;">No falta nada.<br>En <b>Stock</b>, toca lo que se acabe y aparecerá aquí.<br>En el Recetario, abre una receta y pulsa <b>+ semana</b>: aparecerá aquí con sus ingredientes.</div>`;
  if(miss.length){
    html += `<div class="ghead"><span class="t">De la despensa</span><span class="c">${miss.length}</span></div><ul class="shop flat">` +
      miss.map(({z,i})=> `<li data-buy="${i.id}"${i.bought?' class="struck"':''}><span>${esc(i.name)}${i.note?` <span class="muted">(${esc(i.note)})</span>`:''}</span><span class="from">${esc(z.name)}${i.group?` · ${esc(i.group)}`:''}</span></li>`).join('') + `</ul>`;
    if(miss.some(x=> x.i.bought)) html += `<button class="buy-done" data-stock>Ya está en casa: quitar lo tachado</button>`;
  }
  if(weeks.length){
    // las recetas de la semana: se abren tocando el nombre, con raciones, «hecha» y quitar
    const struckAny = weeks.some(({w})=> w.struck.length);
    html += `<div class="ghead" style="margin-top:14px;"><span class="t">Recetas de la semana</span><span class="c">${weeks.length}</span>${struckAny ? '<button class="link" data-act="unstrike" style="margin-left:auto;font-size:13px;">desmarcar todo</button>' : ''}</div>`;
    weeks.forEach(({w, r})=>{
      const f = factorFor(r, w.target), named = r.parts.filter(p=> p.ings.length).length > 1;
      let lis = '';
      r.parts.forEach((p,pi)=>{
        if(!p.ings.length) return;
        if(named) lis += `<li class="sub">${esc(p.name || 'Elaboración ' + (pi+1))}</li>`;
        p.ings.forEach((i,ii)=>{
          const k = pi + ':' + ii, q = scaleQ(i.q, f, i.u);
          lis += `<li data-k="${k}"${w.struck.includes(k)?' class="struck"':''}><span>${q?`<b>${esc(q)}</b> `:''}${i.u && i.u !== 'C/S' ? esc(i.u) + ' ' : ''}${esc(i.n)}${i.u === 'C/S' ? ' <span class="muted">(C/S)</span>' : ''}</span></li>`;
        });
      });
      html += `<div class="card" data-w="${w.id}">
        <div class="card-h">
          <button class="n" data-act="open">${esc(r.name)}${dietMark(r)}</button>
          <button class="sm ok" data-act="done">✓ hecha</button>
          <button class="sm" data-act="rm" aria-label="Quitar de la semana">✕</button>
        </div>
        ${lis ? (anyNumeric(r) ? scalerHTML(r, w.target, 'data-wsc') : '') + `<ul class="shop">${lis}</ul>` : `<div class="note">Sin ingredientes. Tócala para abrirla y añadirlos.</div>`}
      </div>`;
    });
    html += `<div style="text-align:center;padding:10px 0 4px;"><button class="link" data-act="clear">vaciar semana</button></div>`;
  }
  html += `<div class="ghead xhead" style="margin-top:14px;"><span class="t">Otros productos</span>${extra.length?`<span class="c">${extra.length}</span>`:''}<button class="xadd" data-xadd aria-label="Añadir a otros productos">+</button></div>`
    + (ui.xadding ? `<div class="xin"><input class="in" id="x-name" placeholder="Qué (papel de cocina, detergente…)" autocomplete="off" enterkeyhint="done"><button class="sh-btn primary" data-xok>Añadir</button></div>` : '')
    + (extra.length ? `<ul class="shop flat">` + extra.map(x=> `<li data-xbuy="${x.id}"${x.bought?' class="struck"':''}><span>${esc(x.name)}</span></li>`).join('') + `</ul>`
       : (ui.xadding ? '' : `<p class="muted" style="padding:6px 0 0;">Lo que no es de la despensa: pulsa <b>+</b> para apuntarlo.</p>`))
    + (extra.some(x=> x.bought) ? `<button class="buy-done" data-xclear>Comprado: quitar lo tachado</button>` : '');
  const y = window.scrollY;
  main.innerHTML = `<div class="list">${html}</div>`;
  const xi = main.querySelector('#x-name');
  const focusX = ui.xfocus; ui.xfocus = false;
  if(!focusX || !xi) window.scrollTo(0, y); // al tachar, la lista se queda donde estaba
  if(xi){
    if(focusX) xi.focus();
    xi.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); addExtra(); } if(e.key === 'Escape'){ ui.xadding = false; renderPantry(); } });
  }
}
function addExtra(){
  const xi = $('#x-name'), name = xi ? xi.value.trim() : '';
  if(!name){ if(xi){ shake(xi); xi.focus(); } return; }
  data.pantry.extra = data.pantry.extra || [];
  data.pantry.extra.push({ id: uid(), name, bought: false });
  ui.xfocus = true; // para seguir apuntando otra cosa
  save(); renderPantry(); renderPTabs();
}
function pantryClick(e){
  if(ui.ptab === 'semana' || (ui.ptab === 'compra' && e.target.closest('.card[data-w], [data-act=unstrike], [data-act=clear]'))){ weekClick(e); renderPTabs(); return; }
  const t = e.target;
  if(t.closest('[data-addzone]')) return openZone(null);
  const ze = t.closest('[data-zedit]'); if(ze) return openZone(ze.dataset.zedit);
  const ai = t.closest('[data-additem]'); if(ai) return openItem(null, ai.dataset.additem);
  const sb = t.closest('[data-sub]');
  if(sb){ const k = sb.dataset.sub; if(openSubs.has(k)) openSubs.delete(k); else openSubs.add(k); keepBoard(renderPantry); return; }
  const card = t.closest('[data-item]');
  if(card){
    const z = data.pantry.zones.find(x=> x.id === card.dataset.zone), i = z && z.items.find(x=> x.id === card.dataset.item);
    if(!i) return;
    if(t.closest('[data-edit]')) return openItem(i.id, z.id);
    i.missing = !i.missing; i.bought = false; save();
    keepBoard(renderPantry); renderPTabs(); renderZones();
    toast(i.missing ? `${i.name}: a la compra` : `${i.name}: hay`);
    return;
  }
  const b = t.closest('[data-buy]');
  if(b){ const x = missingItems().find(m=> m.i.id === b.dataset.buy); if(x){ x.i.bought = !x.i.bought; save(); renderPantry(); renderPTabs(); } return; }
  if(t.closest('[data-stock]')){
    let n = 0; missingItems().forEach(({i})=>{ if(i.bought){ i.missing = false; i.bought = false; n++; } });
    save(); renderPantry(); renderPTabs(); toast(`${n} de vuelta en la despensa`); return;
  }
  if(t.closest('[data-xadd]')){ ui.xadding = !ui.xadding; ui.xfocus = ui.xadding; renderPantry(); return; }
  if(t.closest('[data-xok]')){ addExtra(); return; }
  const xb = t.closest('[data-xbuy]');
  if(xb){ const x = (data.pantry.extra || []).find(v=> v.id === xb.dataset.xbuy); if(x){ x.bought = !x.bought; save(); renderPantry(); renderPTabs(); } return; }
  if(t.closest('[data-xclear]')){
    const n = data.pantry.extra.filter(x=> x.bought).length;
    data.pantry.extra = data.pantry.extra.filter(x=> !x.bought); save(); renderPantry(); renderPTabs(); toast(`${n} quitado${n === 1 ? '' : 's'}`); return;
  }
  const wl = t.closest('[data-wk]');
  if(wl){
    const w = data.week.find(x=> x.id === wl.dataset.wk), k = wl.dataset.k;
    if(w){ w.struck = w.struck.includes(k) ? w.struck.filter(x=> x !== k) : [...w.struck, k]; save(); renderPantry(); renderPTabs(); }
  }
}
/* añadir o editar una cosa */
function openItem(itemId, zoneId){
  let zone = data.pantry.zones.find(z=> z.id === zoneId) || data.pantry.zones[0];
  if(!zone){ openZone(null); return; }
  const item = itemId ? zone.items.find(i=> i.id === itemId) : null;
  let selZone = zone.id;
  openSheet(`<div class="sh-head"><button class="x" data-act="close" aria-label="Cerrar">✕</button><h2>${item ? 'Editar' : 'Añadir a la despensa'}</h2>
      ${item ? '<button class="sh-btn primary" data-act="ok">Listo</button>' : ''}</div>
    <div class="sh-body">
      <div class="f"><input class="in" id="it-name" placeholder="Qué (aceite de oliva, huevos…)" value="${item ? esc(item.name) : ''}" autocomplete="off" enterkeyhint="done"></div>
      <div class="f"><input class="in" id="it-note" placeholder="Nota (opcional: virgen extra, de garrafa…)" value="${item ? esc(item.note) : ''}" autocomplete="off" enterkeyhint="done"></div>
      <div class="f"><span class="lb">Dónde</span><div class="chips">${data.pantry.zones.map(z=> `<button class="chip${z.id===selZone?' on':''}" data-zs="${z.id}"><span class="gdot" style="--gc:${tc(z.name)}"></span>${esc(z.name)}</button>`).join('')}</div></div>
      <div class="f"><span class="lb">Grupo</span><div class="chips" id="it-groups"></div>
        <input class="in" id="it-group" placeholder="Otro grupo (opcional)" value="${item ? esc(item.group || '') : ''}" autocomplete="off" enterkeyhint="done" style="margin-top:8px;"></div>
      ${item ? `<div class="foot"><button class="danger" data-act="del">Quitar de la lista</button></div>`
             : `<div class="foot" style="margin-top:22px;"><button class="sh-btn primary" data-act="add" style="height:44px;">Añadir</button></div>
                <p class="muted" style="margin-top:14px;">Con Intro se añade y puedes escribir la siguiente.</p>`}
    </div>`, '', sh=>{
      const nm = sh.querySelector('#it-name'), nt = sh.querySelector('#it-note'), gr = sh.querySelector('#it-group');
      const drawGroups = ()=>{
        const z = data.pantry.zones.find(x=> x.id === selZone), gs = [];
        (z ? z.items : []).forEach(i=>{ if(i.group && !gs.includes(i.group)) gs.push(i.group); });
        sh.querySelector('#it-groups').innerHTML = gs.length ? gs.map(g=> `<button class="chip${gr.value.trim()===g?' on':''}" data-gs="${esc(g)}">${esc(g)}</button>`).join('') : '<span class="muted">Esta zona aún no tiene grupos.</span>';
      };
      drawGroups(); gr.addEventListener('input', drawGroups);
      setTimeout(()=> nm.focus(), 50);
      const commit = ()=>{
        const name = nm.value.trim();
        if(!name){ shake(nm); nm.focus(); return false; }
        const target = data.pantry.zones.find(z=> z.id === selZone);
        if(item){
          item.name = name; item.note = nt.value.trim(); item.group = gr.value.trim();
          if(target && !target.items.includes(item)){ zone.items = zone.items.filter(i=> i !== item); target.items.push(item); }
        } else target.items.push({ id: uid(), name, note: nt.value.trim(), group: gr.value.trim(), missing: false, bought: false });
        save(); return true;
      };
      const addMore = ()=>{ if(!commit()) return; toast(`Añadido: ${nm.value.trim()}`); nm.value = ''; nt.value = ''; nm.focus(); renderZones(); keepBoard(renderPantry); };
      [nm, nt, gr].forEach(inp=> inp.addEventListener('keydown', e=>{
        if(e.key !== 'Enter') return; e.preventDefault();
        if(item){ if(commit()) closeSheet(); } else addMore();
      }));
      sh.addEventListener('click', e=>{
        const zs = e.target.closest('[data-zs]');
        if(zs){ selZone = zs.dataset.zs; sh.querySelectorAll('[data-zs]').forEach(b=> b.classList.toggle('on', b.dataset.zs === selZone)); drawGroups(); return; }
        const gsb = e.target.closest('[data-gs]');
        if(gsb){ gr.value = gr.value.trim() === gsb.dataset.gs ? '' : gsb.dataset.gs; drawGroups(); return; }
        const a = e.target.closest('[data-act]'); if(!a) return;
        const act = a.dataset.act;
        if(act === 'close') return closeSheet();
        if(act === 'add') return addMore();
        if(act === 'ok'){ if(commit()) closeSheet(); return; }
        if(act === 'del' && confirm(`¿Quitar «${item.name}» de la lista?`)){ zone.items = zone.items.filter(i=> i !== item); save(); closeSheet(); }
      });
    });
}
/* crear, renombrar o quitar una zona */
function openZone(zoneId){
  const zone = zoneId ? data.pantry.zones.find(z=> z.id === zoneId) : null;
  openSheet(`<div class="sh-head"><button class="x" data-act="close" aria-label="Cerrar">✕</button><h2>${zone ? 'Zona' : 'Nueva zona'}</h2>
      <button class="sh-btn primary" data-act="ok">${zone ? 'Listo' : 'Crear'}</button></div>
    <div class="sh-body">
      <div class="f"><input class="in" id="z-name" placeholder="Nevera, Congelador, Especias…" value="${zone ? esc(zone.name) : ''}" autocomplete="off" enterkeyhint="done"></div>
      ${zone ? `<div class="foot"><button data-act="left">← Mover a la izquierda</button><button class="danger" data-act="del">Quitar zona</button></div>` : ''}
    </div>`, '', sh=>{
      const nm = sh.querySelector('#z-name');
      setTimeout(()=> nm.focus(), 50);
      const ok = ()=>{
        const name = nm.value.trim(); if(!name){ shake(nm); return; }
        if(zone) zone.name = name; else data.pantry.zones.push({ id: uid(), name, items: [] });
        save(); closeSheet();
      };
      nm.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); ok(); } });
      sh.addEventListener('click', e=>{
        const a = e.target.closest('[data-act]'); if(!a) return;
        const act = a.dataset.act;
        if(act === 'close') return closeSheet();
        if(act === 'ok') return ok();
        if(act === 'left'){ const zs = data.pantry.zones, i = zs.indexOf(zone); if(i > 0){ zs.splice(i,1); zs.splice(i-1,0,zone); save(); toast('Movida'); } return; }
        if(act === 'del'){
          if(zone.items.length && !confirm(`«${zone.name}» tiene ${zone.items.length} cosas. ¿Quitar la zona y todo lo que tiene?`)) return;
          data.pantry.zones = data.pantry.zones.filter(z=> z !== zone);
          if(ui.zone === zone.id) ui.zone = '';
          save(); closeSheet();
        }
      });
    });
}

/* ---------- cargar un archivo a mano ---------- */
const fileInput = document.createElement('input');
fileInput.type = 'file'; fileInput.accept = '.json,.txt,.md,application/json,text/plain,text/markdown';
fileInput.addEventListener('change', async ()=>{
  const f = fileInput.files[0]; fileInput.value = '';
  if(!f) return;
  const txt = await f.text();
  let res = null;
  try{ res = applyFile(JSON.parse(txt.replace(/^[^{]*/, '').replace(/[^}]*$/, ''))); }catch(e){}
  if(!res){
    // también vale un texto con recetas en el formato de «Copiar como texto»
    const list = parseTemplate(txt, ui.tab === 'semana' ? 'recetas' : ui.tab);
    if(!list.length){ toast('Ese archivo no tiene recetas'); return; }
    list.forEach(n=>{
      const ex = data.recipes.find(x=> x.tab === n.tab && norm(x.name) === norm(n.name));
      if(ex) Object.assign(ex, n); else data.recipes.push(Object.assign({ id: uid(), done:false }, n));
    });
    save(); res = { added: list.length, changed: 0, removed: 0 };
  }
  if(sheetOpen) closeSheet(); else render();
  toast(syncMsg(res) || 'Sin cambios');
});

/* ---------- data.json publicado (GitHub) ---------- */
let syncing = false, lastTry = 0;
async function syncFromGithub(){
  if(syncing || !/^https?:/.test(location.protocol)) return;
  syncing = true; lastTry = Date.now();
  try{
    const res = await fetch('data.json?t=' + Date.now(), {cache:'no-store'});
    if(!res.ok) return;
    const out = applyFile(await res.json());
    if(out){
      const msg = syncMsg(out);
      if(msg || out.pantry){ if(!sheetOpen) render(); toast('Actualizado: ' + [msg, out.pantry ? 'stock nuevo' : ''].filter(Boolean).join(' · ')); }
    }
  }catch(e){}
  finally{ syncing = false; }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && Date.now() - lastTry > 30000) syncFromGithub();
});

/* ============================================================
   ARRANQUE
   ============================================================ */
async function boot(){
  ui = Object.assign({ space:'recetario', tab:'recetas', ptab:'lista', zone:'', filter:{}, tagFilter:{}, group:{}, collapsed:{} }, loadJSON(UIKEY) || {});
  ui.q = ''; ui.searching = false;
  if(ui.tab === 'semana' || ui.tab === 'regiones' || ui.tab === 'pesce') ui.tab = 'recetas';
  if(!Array.isArray(ui.diets)) ui.diets = [];
  ui.diets = ui.diets.filter(k=> DIET_KEYS.includes(k));
  if(ui.ptab === 'semana') ui.ptab = 'compra'; // la Semana ahora va dentro de la Compra
  if(!['lista','compra'].includes(ui.ptab)) ui.ptab = 'lista';
  const stored = loadJSON(KEY);
  if(validData(stored)){
    data = cleanData(stored);
    save();
    render();
    syncFromGithub();
  } else {
    data = cleanData({ version:2, recipes:[] });
    await syncFromGithub();
    save();
    render();
  }
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
window.cocinaApi = { recipes: ()=> data.recipes, byId, openFicha: id=> openFicha(id), dietIcon, DIET, TABS, toast,
  schemaById: id=> data.schemas.find(x=> x.id === id),
  saveSchema(id, patch){ const x = data.schemas.find(s=> s.id === id); if(!x) return; if(patch.board) x.board = patch.board; if(patch.name != null) x.name = patch.name; x.updated = Date.now(); saveSoon(); },
  addSchema(name, board){ const x = cleanSchema({ name, board }); data.schemas.push(x); save(); return x.id; },
  deleteSchema(id){ data.schemas = data.schemas.filter(x=> x.id !== id); save(); },
  refresh(){ if(ui.space !== 'despensa' && ui.tab === 'esquemas' && !sheetOpen) renderMain(); } };
boot();
})();
</script>

/* ---------- colores ---------- */

/* ---------- herramientas de dibujo ---------- */

function toolSvg(k, color){
  // dibujos de las herramientas, al estilo de la paleta de Apple: cuerpo blanco y punta de su color

/* ---------- guardado (IndexedDB) ---------- */
const DB_NAME = 'cocina-pizarra', STORE = 'kv';
let dbp = null;
function db(){
  if(dbp) return dbp;
  dbp = new Promise((res, rej)=>{
    const rq = indexedDB.open(DB_NAME, 1);
    rq.onupgradeneeded = ()=> rq.result.createObjectStore(STORE);
    rq.onsuccess = ()=> res(rq.result); rq.onerror = ()=> rej(rq.error);
  });
  return dbp;
}
async function idbGet(k){ const d = await db(); return new Promise((res, rej)=>{ const r = d.transaction(STORE).objectStore(STORE).get(k); r.onsuccess = ()=> res(r.result); r.onerror = ()=> rej(r.error); }); }
async function idbSet(k, v){ const d = await db(); return new Promise((res, rej)=>{ const t = d.transaction(STORE, 'readwrite'); t.objectStore(STORE).put(v, k); t.oncomplete = ()=> res(); t.onerror = ()=> rej(t.error); }); }
async function idbDel(k){ const d = await db(); return new Promise((res)=>{ const t = d.transaction(STORE, 'readwrite'); t.objectStore(STORE).delete(k); t.oncomplete = ()=> res(); t.onerror = ()=> res(); }); }

/* estado */
let S = null;            // { cur, boards:[{id,name,created,updated,items,scenes,view,opts}] , ui:{...} }
let B = null;            // pizarra abierta
const assets = {};       // id -> dataURL (fotos), se guardan aparte
let loaded = false;
function newBoard(name){
  return { id:'b' + uid(), name: name || 'Sin título', created: Date.now(), updated: Date.now(),
    items: [], scenes: [], view: { x: 0, y: 0, z: 1 }, opts: { grid: true, snap: false, guides: true, dark: false } };
}
async function load(){
  if(loaded) return;
  try{ S = await idbGet('state'); }catch(e){ S = null; }
  if(!S || !Array.isArray(S.boards) || !S.boards.length){ const b = newBoard('Pizarra'); S = { cur: b.id, boards: [b], ui: {} }; }
  S.ui = Object.assign({ tool:'pluma', color:'#1c1c1e', sizes:{}, finger:false, eraserMode:'pixel', conn:true }, S.ui || {});
  B = S.boards.find(b=> b.id === S.cur) || S.boards[0];
  loaded = true;
}
let saveT = 0;
/* EXT: un esquema abierto (vive en data.json de la app, no en las pizarras de este dispositivo)
   { id, mode: 'view' | 'edit', folded: Set } */
let EXT = null;
const VIEW = ()=> !!(EXT && EXT.mode === 'view');
function save(){ if(!B) return; if(VIEW()) return; B.updated = Date.now(); clearTimeout(saveT); saveT = setTimeout(saveNow, 350); }
function saveNow(){
  clearTimeout(saveT); if(!S) return;
  if(EXT && EXT.mode === 'edit' && API.saveSchema) API.saveSchema(EXT.id, { name: B.name, board: { items: clone(B.items), scenes: clone(B.scenes || []), opts: clone(B.opts), view: clone(B.view) } });
  idbSet('state', S).catch(()=> toast('No se pudo guardar la pizarra'));
}
async function loadAssets(board){
  const ids = new Set(board.items.filter(i=> i.t === 'img').map(i=> i.asset));
  await Promise.all([...ids].filter(id=> !assets[id]).map(async id=>{ try{ const v = await idbGet('asset:' + id); if(v) assets[id] = v; }catch(e){} }));
}
function putAsset(dataUrl){ const id = 'a' + uid(); assets[id] = dataUrl; idbSet('asset:' + id, dataUrl).catch(()=>{}); return id; }

/* ---------- deshacer / rehacer ---------- */
let undoStack = [], redoStack = [], snapBefore = null;
function snap(){ return JSON.stringify(B.items); }
function begin(){ snapBefore = snap(); }
function commit(){
  if(snapBefore == null) return;
  const now = snap();
  if(now !== snapBefore){ undoStack.push(snapBefore); if(undoStack.length > 120) undoStack.shift(); redoStack = []; save(); }
  snapBefore = null; updateUndo();
}
function change(fn){ begin(); fn(); commit(); render(); }
function undo(){ if(!undoStack.length) return; redoStack.push(snap()); B.items = JSON.parse(undoStack.pop()); sel = sel.filter(id=> byIdI(id)); stopEdit(true); save(); render(); updateUndo(); }
function redo(){ if(!redoStack.length) return; undoStack.push(snap()); B.items = JSON.parse(redoStack.pop()); sel = sel.filter(id=> byIdI(id)); save(); render(); updateUndo(); }
function updateUndo(){ $$('[data-a=undo]', root).forEach(b=> b.disabled = !undoStack.length); $$('[data-a=redo]', root).forEach(b=> b.disabled = !redoStack.length); }

/* ---------- modelo ---------- */
function byIdI(id){ return B.items.find(i=> i.id === id); }
function isLine(it){ return it.t === 'line'; }
/* caja (sin girar) de un ítem en coordenadas de la pizarra */
function box(it){
  if(isLine(it)){
    const a = endPt(it, 'a'), b = endPt(it, 'b'), c = it.c ? ctrlPt(it, a, b) : null;
    const xs = [a.x, b.x], ys = [a.y, b.y]; if(c){ xs.push(c.x); ys.push(c.y); }
    const x = Math.min(...xs), y = Math.min(...ys);
    return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y };
  }
  return { x: it.x, y: it.y, w: it.w, h: it.h };
}
/* caja que ocupa de verdad (con giro) */
function aabb(it){
  const b = box(it); if(!it.r) return b;
  const cx = b.x + b.w/2, cy = b.y + b.h/2, a = it.r * Math.PI / 180, c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a));
  const w = b.w*c + b.h*s, h = b.w*s + b.h*c;
  return { x: cx - w/2, y: cy - h/2, w, h };
}
function unionBox(items){
  if(!items.length) return null;
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  items.forEach(it=>{ const b = aabb(it); x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y); x2 = Math.max(x2, b.x + b.w); y2 = Math.max(y2, b.y + b.h); });
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
}
/* puntos de conexión: centro de cada lado */
function sidePt(it, side){
  const b = box(it), cx = b.x + b.w/2, cy = b.y + b.h/2;
  let p = side === 't' ? {x: cx, y: b.y} : side === 'b' ? {x: cx, y: b.y + b.h} : side === 'l' ? {x: b.x, y: cy} : {x: b.x + b.w, y: cy};
  if(it.r){ const a = it.r*Math.PI/180, dx = p.x - cx, dy = p.y - cy; p = { x: cx + dx*Math.cos(a) - dy*Math.sin(a), y: cy + dx*Math.sin(a) + dy*Math.cos(a) }; }
  return p;
}
const NORMAL = { t:{x:0,y:-1}, b:{x:0,y:1}, l:{x:-1,y:0}, r:{x:1,y:0} };
function bestSide(it, toward){
  const b = box(it), cx = b.x + b.w/2, cy = b.y + b.h/2, dx = (toward.x - cx) / (b.w || 1), dy = (toward.y - cy) / (b.h || 1);

}
function centerOf(it){ const b = box(it); return { x: b.x + b.w/2, y: b.y + b.h/2 }; }
/* extremo de una línea: punto libre o pegado a un ítem */
function endPt(ln, k){
  const e = ln[k];
  if(e && e.id){
    const it = byIdI(e.id);
    if(it && !isLine(it) && EXT && EXT.mode === 'view' && B.opts.tree && ln.a && ln.a.id && ln.b && ln.b.id){
      // en el árbol, las flechas salen siempre por la derecha del padre y llegan por la izquierda del hijo
      const parentEnd = ln.sa && !ln.ea ? 'b' : 'a', side = k === parentEnd ? 'r' : 'l';
      return Object.assign(sidePt(it, side), { side });

    if(it && !isLine(it)){
      const other = ln[k === 'a' ? 'b' : 'a'];
      const toward = other && other.id && byIdI(other.id) ? centerOf(byIdI(other.id)) : other;
      const side = e.side || bestSide(it, toward || centerOf(it));
      return Object.assign(sidePt(it, side), { side });
    }

}
function ctrlPt(ln, a, b){ return { x: (a.x + b.x)/2 + ln.c.x, y: (a.y + b.y)/2 + ln.c.y }; }

/* ---------- vista ---------- */
let root, vp, world, ui;
const V = ()=> B.view;
function toWorld(sx, sy){ const r = vp.getBoundingClientRect(); return { x: (sx - r.left - V().x) / V().z, y: (sy - r.top - V().y) / V().z }; }
function toScreen(wx, wy){ return { x: wx * V().z + V().x, y: wy * V().z + V().y }; }
function applyView(){
  const v = V();
  world.style.transform = `translate(${v.x}px,${v.y}px) scale(${v.z})`;
  const g = 20 * v.z * (v.z < 0.35 ? 4 : v.z < 0.7 ? 2 : 1);
  vp.style.backgroundSize = `${g}px ${g}px`;
  vp.style.backgroundPosition = `${v.x}px ${v.y}px`;
  vp.classList.toggle('grid', !!B.opts.grid);
  const zl = $('#pz-zoom'); if(zl) zl.textContent = Math.round(v.z * 100) + ' %';
  drawUI();
}
function zoomAt(z, sx, sy){
  const v = V(); z = clamp(z, 0.1, 4);
  const r = vp.getBoundingClientRect(); sx -= r.left; sy -= r.top;
  v.x = sx - (sx - v.x) * z / v.z; v.y = sy - (sy - v.y) * z / v.z; v.z = z;
  applyView(); saveViewSoon();
}
let viewT = 0;
function saveViewSoon(){ clearTimeout(viewT); viewT = setTimeout(save, 600); }
/* llevar la vista a un rectángulo de la pizarra, con animación */
let animRaf = 0;
function animateView(to, ms){
  cancelAnimationFrame(animRaf);
  const from = Object.assign({}, V()), t0 = performance.now(); ms = ms || 380;
  const step = now=>{
    const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    // la escala se interpola en logaritmos para que acercar/alejar se vea uniforme
    const z = Math.exp(Math.log(from.z) + (Math.log(to.z) - Math.log(from.z)) * e);
    const r = vp.getBoundingClientRect();
    const cxF = (r.width/2 - from.x) / from.z, cyF = (r.height/2 - from.y) / from.z;
    const cxT = (r.width/2 - to.x) / to.z, cyT = (r.height/2 - to.y) / to.z;
    const cx = cxF + (cxT - cxF) * e, cy = cyF + (cyT - cyF) * e;
    Object.assign(V(), { z, x: r.width/2 - cx*z, y: r.height/2 - cy*z });
    applyView();
    if(k < 1) animRaf = requestAnimationFrame(step); else saveViewSoon();
  };

}
function viewFor(rect, pad){
  const r = vp.getBoundingClientRect(); pad = pad == null ? 80 : pad;
  const z = clamp(Math.min((r.width - pad*2) / Math.max(rect.w, 1), (r.height - pad*2) / Math.max(rect.h, 1)), 0.1, 4);
  return { z, x: r.width/2 - (rect.x + rect.w/2) * z, y: r.height/2 - (rect.y + rect.h/2) * z };
}
function fitContent(){ const u = unionBox(B.items); if(u) animateView(viewFor(u)); else animateView({ x: vp.clientWidth/2, y: vp.clientHeight/2, z: 1 }); }
function fitSelection(){ const u = unionBox(selItems()); if(u) animateView(viewFor(u)); }
function visibleRect(){ const r = vp.getBoundingClientRect(), v = V(); return { x: -v.x / v.z, y: -v.y / v.z, w: r.width / v.z, h: r.height / v.z }; }
function viewCenter(){ const v = visibleRect(); return { x: v.x + v.w/2, y: v.y + v.h/2 }; }

/* ---------- trazos: contorno con presión (como una pluma de verdad) ---------- */
function inkPath(pts, size, pressure){
  if(!pts.length) return '';
  if(pts.length === 1){ const [x, y, p] = pts[0], r = size * (pressure ? .35 + .8*(p || .5) : .5); return `M${x - r},${y}a${r},${r} 0 1,0 ${r*2},0a${r},${r} 0 1,0 ${-r*2},0`; }
  // suavizado: media móvil corta
  const P = pts.map((p, i)=>{
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    return i === 0 || i === pts.length - 1 ? p : [(a[0] + p[0]*2 + b[0]) / 4, (a[1] + p[1]*2 + b[1]) / 4, p[2]];
  });
  const W = P.map((p, i)=>{
    let w = size * (pressure ? .35 + .85*(p[2] == null ? .5 : p[2]) : .5);
    // las puntas se afinan un poco
    if(pressure){ const n = P.length, t = Math.min(i, n - 1 - i); if(t < 3) w *= .6 + t*.13; }
    return w;
  });
  const L = [], R = [];
  for(let i = 0; i < P.length; i++){
    const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
    L.push([P[i][0] - dy*W[i], P[i][1] + dx*W[i]]); R.push([P[i][0] + dy*W[i], P[i][1] - dx*W[i]]);
  }
  const f = n=> Math.round(n * 100) / 100;
  const curve = arr=>{ let s = ''; for(let i = 1; i < arr.length - 1; i++){ const m = [(arr[i][0] + arr[i+1][0])/2, (arr[i][1] + arr[i+1][1])/2]; s += `Q${f(arr[i][0])},${f(arr[i][1])} ${f(m[0])},${f(m[1])}`; } const l = arr[arr.length-1]; return s + `L${f(l[0])},${f(l[1])}`; };
  const e = P.length - 1, rr = R.slice().reverse();
  return `M${f(L[0][0])},${f(L[0][1])}` + curve(L) +
    `A${f(W[e])},${f(W[e])} 0 0,1 ${f(R[e][0])},${f(R[e][1])}` + curve(rr) +
    `A${f(W[0])},${f(W[0])} 0 0,1 ${f(L[0][0])},${f(L[0][1])}Z`;
}
function inkCenterLine(pts){ return pts.map((p, i)=> (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(''); }

/* ---------- formas ---------- */
const SHAPES = ['line','arrow','curve','rrect','circle','triangle','pentagon','square','diamond','pill','para','arrowR','star','hexagon','bubble'];
function shapePath(kind, w, h){
  switch(kind){
    case 'rrect': { const r = Math.min(w, h) * .14; return `M${r},0H${w-r}Q${w},0 ${w},${r}V${h-r}Q${w},${h} ${w-r},${h}H${r}Q0,${h} 0,${h-r}V${r}Q0,0 ${r},0Z`; }
    case 'square': return `M0,0H${w}V${h}H0Z`;
    case 'circle': return `M${w/2},0A${w/2},${h/2} 0 1,1 ${w/2},${h}A${w/2},${h/2} 0 1,1 ${w/2},0Z`;
    case 'triangle': return `M${w/2},0L${w},${h}L0,${h}Z`;
    case 'diamond': return `M${w/2},0L${w},${h/2}L${w/2},${h}L0,${h/2}Z`;
    case 'pentagon': return `M${w/2},0L${w},${h*.38}L${w*.81},${h}L${w*.19},${h}L0,${h*.38}Z`;
    case 'hexagon': return `M${w*.25},0H${w*.75}L${w},${h/2}L${w*.75},${h}H${w*.25}L0,${h/2}Z`;
    case 'pill': { const r = Math.min(w, h)/2; return `M${r},0H${w-r}A${r},${r} 0 0,1 ${w-r},${h}H${r}A${r},${r} 0 0,1 ${r},0Z`; }
    case 'para': return `M${w*.22},0H${w}L${w*.78},${h}H0Z`;
    case 'arrowR': return `M0,${h*.3}H${w*.58}V0L${w},${h/2}L${w*.58},${h}V${h*.7}H0Z`;
    case 'star': { let s = ''; for(let i = 0; i < 10; i++){ const a = -Math.PI/2 + i*Math.PI/5, r = i % 2 ? .4 : 1; s += (i ? 'L' : 'M') + (w/2 + Math.cos(a)*w/2*r).toFixed(1) + ',' + (h/2 + Math.sin(a)*h/2*r + h*.04).toFixed(1); } return s + 'Z'; }
    case 'bubble': { const r = Math.min(w, h)*.18, hb = h*.8; return `M${r},0H${w-r}Q${w},0 ${w},${r}V${hb-r}Q${w},${hb} ${w-r},${hb}H${w*.42}L${w*.22},${h}L${w*.26},${hb}H${r}Q0,${hb} 0,${hb-r}V${r}Q0,0 ${r},0Z`; }

}
function shapeIcon(kind){
  if(kind === 'line') return `<svg viewBox="0 0 46 46"><path d="M10 36L36 10" stroke="#1c1c1e" stroke-width="2.2" stroke-linecap="round"/></svg>`;
  if(kind === 'arrow') return `<svg viewBox="0 0 46 46"><path d="M10 36L35 11M24 11h11v11" fill="none" stroke="#1c1c1e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if(kind === 'curve') return `<svg viewBox="0 0 46 46"><path d="M12 36C12 20 22 12 36 12" fill="none" stroke="#1c1c1e" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="36" r="2.2" fill="#2f8cf5"/><circle cx="36" cy="12" r="2.2" fill="#2f8cf5"/><circle cx="16" cy="20" r="2.2" fill="#34c759"/></svg>`;
  const w = kind === 'pill' || kind === 'para' || kind === 'arrowR' ? 36 : 32, h = kind === 'pill' ? 18 : kind === 'para' ? 20 : 32;
  return `<svg viewBox="0 0 46 46"><g transform="translate(${(46-w)/2},${(46-h)/2})"><path d="${shapePath(kind, w, h)}" fill="#6cc0f5"/></g></svg>`;
}

/* ---------- pintar ítems ---------- */
function isDark(c){ const m = /^#?([0-9a-f]{6})$/i.exec(c || ''); if(!m) return false; const n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (r*299 + g*587 + b*114) / 1000 < 140; }
const els = new Map(); // id -> elemento
function fsPx(it){ return (it.fs || 18); }
function itemHTML(it){
  switch(it.t){
    case 'note': return `<div class="tx" data-ph="" style="font-size:${fsPx(it)}px;color:${it.color||'#1c1c1e'};font-weight:${it.bold?700:400};text-align:${it.align||'center'}">${esc(it.text||'')}</div>`;
    case 'text': return `<div class="tx" data-ph="Toca dos veces para escribir" style="font-size:${fsPx(it)}px;color:${it.color||'currentColor'};font-weight:${it.bold?700:400};text-align:${it.align||'left'}">${esc(it.text||'')}</div>`;
    case 'shape': {
      const sw = it.sw == null ? 0 : it.sw;
      return `<svg viewBox="0 0 ${it.w} ${it.h}" preserveAspectRatio="none" style="width:100%;height:100%"><path d="${shapePath(it.kind, it.w, it.h)}" fill="${it.fill||'#5ab4f0'}" stroke="${it.stroke||'#1c1c1e'}" stroke-width="${sw}" vector-effect="non-scaling-stroke"/></svg>` +
        `<div class="tx" style="font-size:${fsPx(it)}px;color:${it.color||'#1c1c1e'};font-weight:${it.bold?700:400};text-align:${it.align||'center'}">${esc(it.text||'')}</div>`;
    }
    case 'table': {
      const rows = it.rows, nr = rows.length, nc = rows[0].length;
      return rows.map((row, r)=> row.map((c, k)=> `<div class="cell${k === nc-1 ? ' lc' : ''}${r === nr-1 ? ' lr' : ''}${r === 0 && it.head ? ' hd' : ''}" data-r="${r}" data-c="${k}" style="${r === 0 && it.head ? 'font-weight:700;background:#f2f2f4;' : ''}">${esc(c)}</div>`).join('')).join('');
    }
    case 'img': return `<img src="${assets[it.asset] || ''}" alt="" draggable="false">`;
    case 'link': { let host = ''; try{ host = new URL(it.url).hostname.replace(/^www\./, ''); }catch(e){ host = it.url; } return `<div class="lt">${esc(it.title || host)}</div><div class="lu">${esc(host)}</div>`; }
    case 'rec': {
      const r = API.byId && API.byId(it.rid);
      if(!r) return `<span class="n">${esc(it.name || 'Receta')} (ya no está)</span>`;
      const d = API.DIET && API.DIET[r.diet];
      return `<span class="n">${esc(r.name)}${d ? `<span class="dz" style="--dc:${d.c}">${API.dietIcon(r.diet, 14)}</span>` : ''}</span>`;
    }
    case 'ink': {
      const t = TOOLS[it.tool] || TOOLS.pluma;
      return `<svg viewBox="0 0 ${it.w0} ${it.h0}" preserveAspectRatio="none"><path class="ip" d="${it.d || ''}" fill="${it.color}" fill-opacity="${t.op}"/><path class="hit" d="${inkCenterLine(it.pts)}" stroke-width="${Math.max(14, (it.size||3)*2)}" vector-effect="non-scaling-stroke"/></svg>`;

}
function arrowHead(tip, from, size, color){
  const a = Math.atan2(tip.y - from.y, tip.x - from.x), s = size;
  const p1 = { x: tip.x - Math.cos(a - .45)*s, y: tip.y - Math.sin(a - .45)*s }, p2 = { x: tip.x - Math.cos(a + .45)*s, y: tip.y - Math.sin(a + .45)*s };
  return `<path d="M${p1.x},${p1.y}L${tip.x},${tip.y}L${p2.x},${p2.y}" fill="none" stroke="${color}" stroke-width="${Math.max(1.5, s/5)}" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function linePathData(it){

    const L = Math.hypot(b.x - a.x, b.y - a.y) / 2.6;
    const na = a.side ? NORMAL[a.side] : null, nb = b.side ? NORMAL[b.side] : null;
    const c1 = na ? { x: a.x + na.x*L, y: a.y + na.y*L } : a, c2 = nb ? { x: b.x + nb.x*L, y: b.y + nb.y*L } : b;

function placeEl(el, it){

  el.style.width = it.w + 'px'; el.style.height = it.h + 'px';

}
function itemClass(it){

    (it.t === 'ink' && TOOLS[it.tool] && TOOLS[it.tool].hl ? ' hl' : '') + (it.lock ? ' locked' : '') +
    (it.t === 'rec' && !(API.byId && API.byId(it.rid)) ? ' gone' : '') + (EXT && it.info ? ' has-info' : '') + (it.t !== 'rec' && it.rid && API.byId && API.byId(it.rid) ? ' has-rid' : '');
}
function styleEl(el, it){

  if(it.t === 'table'){ el.style.gridTemplateColumns = `repeat(${it.rows[0].length}, 1fr)`; el.style.gridTemplateRows = `repeat(${it.rows.length}, 1fr)`; el.style.fontSize = fsPx(it) + 'px'; }
  if(it.t === 'rec'){
    el.style.fontSize = clamp(it.h * .32, 11, 120) + 'px';

    el.style.background = it.fill || ''; el.style.color = it.fill && isDark(it.fill) ? '#fff' : '';
    el.style.borderColor = it.fill && it.fill !== '#ffffff' ? 'rgba(0,0,0,.08)' : '';

function renderItem(it){

  if(el._html !== html && !(editing && editing.id === it.id)){ el.innerHTML = html; el._html = html; }
  styleEl(el, it); placeEl(el, it);

}
function render(){
  if(!B || !world) return;
  const keep = new Set(), hid = VIEW() ? hiddenSet() : null;
  B.items.forEach((it, i)=>{
    if(it.t === 'ink' && !it.d) it.d = inkPath(it.pts, it.size, (TOOLS[it.tool] || {}).pressure);
    const el = renderItem(it); keep.add(it.id);
    el.style.display = hid && hid.has(it.id) ? 'none' : '';
    if(world.children[i] !== el) world.insertBefore(el, world.children[i] || null);

/* solo mover (durante un arrastre): ítems y líneas pegadas a ellos */

  const set = new Set(ids);
  ids.forEach(id=>{ const it = byIdI(id); if(it) renderItem(it); });
  B.items.forEach(it=>{ if(isLine(it) && !set.has(it.id) && ((it.a && set.has(it.a.id)) || (it.b && set.has(it.b.id)))) renderItem(it); });
  drawUI();
}

/* ---------- selección y controles ---------- */

function expandGroups(ids){
  const out = new Set(ids);
  ids.forEach(id=>{ const it = byIdI(id); if(it && it.g) B.items.forEach(o=>{ if(o.g === it.g) out.add(o.id); }); });
  return [...out];
}
function setSel(ids){ sel = expandGroups(ids); closeMenu(); drawUI(); }
function screenBox(b){ const p = toScreen(b.x, b.y), z = V().z; return { x: p.x, y: p.y, w: b.w*z, h: b.h*z }; }
function drawUI(){
  const layer = $('#pz-sel', root); if(!layer) return;

  let h = '';
  const items = selItems();
  if(items.length === 1 && isLine(items[0])){
    const it = items[0], { a, b } = linePathData(it), A = toScreen(a.x, a.y), Bp = toScreen(b.x, b.y);
    const mid = it.c ? toScreen(ctrlPt(it, a, b).x, ctrlPt(it, a, b).y) : { x: (A.x + Bp.x)/2, y: (A.y + Bp.y)/2 };

      if(!(it.a && it.a.id) && !(it.b && it.b.id) || it.c) h += `<div class="pz-h mid" data-h="mid" style="left:${mid.x}px;top:${mid.y}px"></div>`;
    } else h += `<div class="pz-h lockh" style="left:${mid.x}px;top:${mid.y}px">${IC.lock.replace('<svg', '<svg width="14" height="14"')}</div>`;
  } else if(items.length){
    const single = items.length === 1 ? items[0] : null;
    const b = single ? box(single) : unionBox(items), s = screenBox(b), rot = single ? (single.r || 0) : 0;
    const locked = items.some(i=> i.lock);
    h += `<div class="pz-selbox" style="left:${s.x}px;top:${s.y}px;width:${s.w}px;height:${s.h}px;transform:rotate(${rot}deg)"></div>`;
    const cx = s.x + s.w/2, cy = s.y + s.h/2, ang = rot*Math.PI/180;
    const R = (x, y)=> ({ x: cx + (x - cx)*Math.cos(ang) - (y - cy)*Math.sin(ang), y: cy + (x - cx)*Math.sin(ang) + (y - cy)*Math.cos(ang) });
    if(locked){ const p = R(s.x + s.w, s.y); h += `<div class="pz-h lockh" data-h="unlock" style="left:${p.x}px;top:${p.y}px">${IC.lock.replace('<svg', '<svg width="14" height="14"')}</div>`; }
    else if(!editing){
      const small = s.w < 44 || s.h < 44;
      const pts = { nw:[s.x, s.y], n:[cx, s.y], ne:[s.x+s.w, s.y], e:[s.x+s.w, cy], se:[s.x+s.w, s.y+s.h], s:[cx, s.y+s.h], sw:[s.x, s.y+s.h], w:[s.x, cy] };
      Object.entries(pts).forEach(([k, [x, y]])=>{ if(small && k.length === 1) return; if(single && single.t === 'text' && (k === 'n' || k === 's')) return; const p = R(x, y); h += `<div class="pz-h" data-h="${k}" style="left:${p.x}px;top:${p.y}px"></div>`; });
      if(single && single.t !== 'ink'){ const p = R(cx, s.y - 30); h += `<div class="pz-h rot" data-h="rot" style="left:${p.x}px;top:${p.y}px"></div>`; }
      if(single && single.t === 'table'){
        const pr = R(s.x + s.w + 24, cy), pb = R(cx, s.y + s.h + 24);
        h += `<div class="pz-plus" data-h="addcol" style="left:${pr.x}px;top:${pr.y}px">+</div><div class="pz-plus" data-h="addrow" style="left:${pb.x}px;top:${pb.y}px">+</div>`;
      }
      if(single && S.ui.conn && !['ink','table'].includes(single.t)){
        const off = 30;
        [['t', cx, s.y - off - (single ? 0 : 0)], ['b', cx, s.y + s.h + off], ['l', s.x - off, cy], ['r', s.x + s.w + off, cy]].forEach(([k, x, y])=>{
          if(k === 't'){ x = cx + 34; } // arriba está el tirador de giro: la flecha va al lado
          const p = R(x, y); h += `<div class="pz-conn" data-h="conn-${k}" style="left:${p.x}px;top:${p.y}px">${ARROWS[k]}</div>`;
        });
      }
    }
  }
  guides.forEach(g=>{ h += `<div class="pz-guide" style="left:${Math.min(g.x1, g.x2)}px;top:${Math.min(g.y1, g.y2)}px;width:${Math.max(1, Math.abs(g.x2 - g.x1))}px;height:${Math.max(1, Math.abs(g.y2 - g.y1))}px"></div>`; });
  if(marquee) h += `<div class="pz-marq" style="left:${marquee.x}px;top:${marquee.y}px;width:${marquee.w}px;height:${marquee.h}px"></div>`;
  if(eraserDot) h += `<div class="pz-eraser" style="left:${eraserDot.x - eraserDot.r}px;top:${eraserDot.y - eraserDot.r}px;width:${eraserDot.r*2}px;height:${eraserDot.r*2}px"></div>`;
  layer.innerHTML = h;
  drawCtx();
}

/* ---------- barra de opciones del ítem seleccionado ---------- */
function drawCtx(){
  const bar = $('#pz-ctx', root);
  const items = selItems();
  if(!items.length || ctxHidden || drawing){ bar.style.display = 'none'; return; }
  const one = items.length === 1 ? items[0] : null, locked = items.some(i=> i.lock);
  let h = '';
  const btn = (a, label, extra)=> `<button data-c="${a}">${extra || ''}${label}</button>`;
  if(locked){ h = btn('unlock', 'Desbloquear', IC.lock.replace('<svg', '<svg width="16" height="16"')); }
  else if(editing){ h = btn('textstyle', 'Aa') + btn('done', 'OK'); }
  else {
    if(one && one.t === 'rec') h += btn('open', 'Abrir receta');
    if(one && one.t === 'link') h += btn('openlink', 'Abrir enlace') + btn('editlink', 'Editar');
    const colorable = items.every(i=> ['note','shape','line','ink','text','rec'].includes(i.t));
    if(colorable){ const c = colorOf(items[0]); h += `<button data-c="color"><span class="cs" style="background:${c === 'transparent' ? 'conic-gradient(#ddd 25%,#fff 0 50%,#ddd 0 75%,#fff 0)' : c}"></span>Color</button>`; }
    if(one && one.t === 'shape') h += btn('border', 'Borde');
    if(one && one.t === 'line') h += btn('linestyle', 'Estilo');
    if(items.every(i=> ['note','shape','text','table'].includes(i.t))) h += btn('textstyle', 'Aa');
    if(one && ['note','shape','text'].includes(one.t)) h += btn('edit', 'Editar texto');
    if(one && one.t === 'table') h += btn('tablemenu', 'Tabla');

    h += '<span class="vs"></span>' + btn('arrange', 'Disponer') + btn('dup', 'Duplicar') + btn('copy', 'Copiar') + btn('del', 'Eliminar');
  }
  if(bar._h !== h){ bar.innerHTML = h; bar._h = h; } // sin rehacerla si no cambia: así no se pierde un toque a medias
  bar.style.display = 'flex';

  const u = unionBox(items), s = screenBox(u), r = vp.getBoundingClientRect();

  let x = s.x + s.w/2 - bw/2, y = s.y - bh - (one && !isLine(one) && !locked && !editing ? 48 : 16);
  if(y < 64) y = s.y + s.h + 40;
  if(y + bh > r.height - 70) y = Math.max(64, Math.min(r.height - 70 - bh, s.y + 10));

}
function colorOf(it){ return it.t === 'rec' ? (it.fill || '#ffffff') : it.t === 'note' ? (it.fill || NOTE_COLORS[0]) : it.t === 'shape' ? (it.fill || '#5ab4f0') : it.t === 'text' ? (it.color || '#1c1c1e') : (it.color || '#1c1c1e'); }


/* activar botones al levantar el dedo (y no solo con «click»): tras algunos gestos el
   navegador se come el click, y así ningún botón se queda sin responder */
function onTap(el, selector, fn){
  let down = null, fired = 0;
  el.addEventListener('pointerdown', e=>{ down = e.target.closest(selector); });
  el.addEventListener('pointerup', e=>{
    const b = e.target.closest(selector);
    if(b && b === down && e.pointerType !== 'mouse'){ fired = performance.now(); fn(b, e); }
    down = null;
  });
  el.addEventListener('click', e=>{
    const b = e.target.closest(selector); if(!b) return;
    if(performance.now() - fired < 700) return;
    fn(b, e);
  });
}

/* ---------- menús emergentes ---------- */
let menuEl = null, menuClose = null;
function closeMenu(){ if(menuEl){ menuEl.remove(); menuEl = null; } if(menuClose){ const f = menuClose; menuClose = null; f(); } }
function openMenu(anchor, html, onClick, opts){
  closeMenu(); opts = opts || {};
  const m = document.createElement('div'); m.className = 'pz-menu' + (opts.cls ? ' ' + opts.cls : ''); m.innerHTML = html;
  ui.appendChild(m); menuEl = m; menuClose = opts.onClose || null;
  const r = vp.getBoundingClientRect();
  let ax, ay, below = true;
  if(anchor && anchor.getBoundingClientRect){ const a = anchor.getBoundingClientRect(); ax = a.left + a.width/2 - r.left; ay = a.bottom - r.top + 8; if(a.top - r.top > r.height * .55){ below = false; ay = a.top - r.top - 8; } }
  else { ax = anchor.x; ay = anchor.y; }
  const mw = m.offsetWidth, mh = m.offsetHeight;
  m.style.left = clamp(ax - mw/2, 8, r.width - mw - 8) + 'px';
  m.style.top = clamp(below ? ay : ay - mh, 8, r.height - mh - 8) + 'px';
  m.addEventListener('pointerdown', e=> e.stopPropagation());

function swatches(list, cur, attr){

    `<label class="pz-sw wheel" title="Otro color"><input type="color" data-pick="${attr}" value="${/^#[0-9a-f]{6}$/i.test(cur) ? cur : '#3478f6'}"></label></div>`;
}
let toastT = 0;
function toast(msg){ const t = $('.pz-toast', root); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=> t.classList.remove('show'), 1800); }

/* ---------- crear ítems ---------- */
function sizeK(){ return clamp(1 / V().z, 1, 4); }
function placeNew(it, at){
  const k = sizeK(); if(!isLine(it)){ it.w *= k; it.h *= k; if(it.fs) it.fs = Math.round(it.fs * k); }
  const c = at || viewCenter();
  if(!isLine(it)){
    it.x = c.x - it.w/2; it.y = c.y - it.h/2;
    // si ya hay algo justo ahí, se desplaza un poco para que no quede tapado
    for(let n = 0; n < 20 && B.items.some(o=> !isLine(o) && Math.abs(o.x - it.x) < 4 && Math.abs(o.y - it.y) < 4); n++){ it.x += 24*k; it.y += 24*k; }
  }
  return it;
}
function addItem(it, opts){
  opts = opts || {};
  it.id = it.id || 'i' + uid();
  change(()=> B.items.push(it));
  setSel([it.id]);
  if(opts.edit) setTimeout(()=> startEdit(it.id), 30);
  return it;
}
function addNote(at){ return addItem(placeNew({ t:'note', w:200, h:200, fill: S.ui.noteColor || NOTE_COLORS[0], fs:20, text:'' }, at), { edit:true }); }
function addText(at){ return addItem(placeNew({ t:'text', w:260, h:40, fs:24, text:'' }, at), { edit:true }); }
function addTable(at){ return addItem(placeNew({ t:'table', w:300, h:120, fs:16, rows:[['',''],['',''],['','']] }, at)); }
function addShape(kind, at){
  if(kind === 'line' || kind === 'arrow' || kind === 'curve'){
    const c = at || viewCenter(), k = sizeK(), L = 90*k;
    const it = { t:'line', a:{ x: c.x - L, y: c.y + L*.5 }, b:{ x: c.x + L, y: c.y - L*.5 }, sw: 2.5, color: '#1c1c1e', ea: kind === 'arrow' };
    if(kind === 'curve') it.c = { x: -L*.5, y: -L*.6 };
    return addItem(it);
  }
  const sq = ['circle','square','triangle','pentagon','diamond','star','hexagon'].includes(kind);
  return addItem(placeNew({ t:'shape', kind, w: kind === 'pill' ? 220 : sq ? 160 : 200, h: kind === 'pill' ? 90 : sq ? 160 : kind === 'arrowR' ? 120 : 140, fill:'#5ab4f0', stroke:'#1c1c1e', sw:0, fs:18, text:'' }, at));
}
function addRecipe(rid, at){ const r = API.byId(rid); return addItem(placeNew({ t:'rec', rid, name: r ? r.name : '', w:240, h:60 }, at)); }
function addLink(url, title){ return addItem(placeNew({ t:'link', url, title: title || '', w:260, h:90 })); }
function addImageFile(file, at){
  if(!file || !/^image\//.test(file.type)) return;
  if(VIEW()) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      // se reduce a 1600 px como mucho: cabe de sobra en la pizarra y no llena la memoria
      const m = 1600, s = Math.min(1, m / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width*s); cv.height = Math.round(img.height*s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const url = cv.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', .85);
      const asset = putAsset(url), w0 = 320, h0 = w0 * cv.height / cv.width;
      addItem(placeNew({ t:'img', asset, w: w0, h: h0 }, at));
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

/* ---------- editar texto ---------- */
function startEdit(id, cell){
  const it = byIdI(id); if(!it || it.lock) return;
  if(!['note','text','shape','table'].includes(it.t)) return;
  stopEdit();
  begin();
  editing = { id, cell };
  sel = [id];
  const el = els.get(id); el.classList.add('editing');
  const tx = it.t === 'table' ? el.querySelector(`.cell[data-r="${cell ? cell.r : 0}"][data-c="${cell ? cell.c : 0}"]`) : el.querySelector('.tx');
  if(it.t === 'table' && !cell) editing.cell = { r: 0, c: 0 };
  tx.contentEditable = 'true'; tx.spellcheck = true;
  tx.focus();
  try{ const rg = document.createRange(); rg.selectNodeContents(tx); rg.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); }catch(e){}
  tx.addEventListener('input', ()=>{ readEdit(); if(it.t === 'text') autoHeight(it, tx); drawUI(); });
  tx.addEventListener('keydown', e=>{
    if(e.key === 'Escape'){ e.preventDefault(); stopEdit(); render(); }
    if(e.key === 'Tab' && it.t === 'table'){ e.preventDefault(); const nc = it.rows[0].length, nr = it.rows.length; let { r, c } = editing.cell; c++; if(c >= nc){ c = 0; r = (r + 1) % nr; } stopEdit(); startEdit(id, { r, c }); }
  });
  drawUI();
}
function readEdit(){
  if(!editing) return;
  const it = byIdI(editing.id), el = els.get(editing.id); if(!it || !el) return;
  if(it.t === 'table'){ const c = el.querySelector(`.cell[data-r="${editing.cell.r}"][data-c="${editing.cell.c}"]`); if(c) it.rows[editing.cell.r][editing.cell.c] = c.innerText.replace(/\n$/, ''); }
  else { const tx = el.querySelector('.tx'); it.text = tx.innerText.replace(/\n$/, ''); }
}
function autoHeight(it, tx){ const z = 1; const need = tx.scrollHeight / z; if(need > it.h - 2){ it.h = need + 4; placeEl(els.get(it.id), it); } }
function stopEdit(silent){
  if(!editing) return;
  const id = editing.id;
  if(!silent) readEdit();
  const el = els.get(id);
  if(el){ $$('[contenteditable]', el).forEach(x=>{ x.contentEditable = 'false'; x.blur(); }); el.classList.remove('editing'); el._html = null; }
  editing = null;
  const it = byIdI(id);
  if(it && it.t === 'text' && !it.text.trim() && !silent){ B.items = B.items.filter(i=> i !== it); sel = []; }
  if(!silent) commit(); else snapBefore = null;
  render();
}

/* ---------- acciones de la barra de opciones ---------- */
let clipboard = null;
function delSel(){
  const ids = new Set(sel); if(!ids.size) return;
  change(()=>{
    // las líneas pegadas a lo que se borra se quedan sueltas en su sitio
    B.items.forEach(it=>{ if(isLine(it)) ['a','b'].forEach(k=>{ if(it[k] && it[k].id && ids.has(it[k].id) && !ids.has(it.id)){ const p = endPt(it, k); it[k] = { x: p.x, y: p.y }; } }); });
    B.items = B.items.filter(i=> !ids.has(i.id));
  });
  sel = []; drawUI();
}
function cloneItems(items, dx, dy){
  const map = {}, gmap = {};
  const out = items.map(it=>{ const c = clone(it); map[it.id] = c.id = 'i' + uid(); if(c.g){ c.g = gmap[c.g] || (gmap[c.g] = 'g' + uid()); } return c; });
  out.forEach(c=>{
    if(isLine(c)) ['a','b'].forEach(k=>{ const e = c[k]; if(e.id){ if(map[e.id]) e.id = map[e.id]; else { const p = endPt(Object.assign({}, c, { [k]: e }), k); c[k] = { x: p.x, y: p.y }; } } if(!c[k].id){ c[k].x += dx; c[k].y += dy; } });
    else { c.x += dx; c.y += dy; }
    c.lock = false;
  });
  return out;
}
function duplicate(){ const items = selItems(); if(!items.length) return; const k = 24 / V().z; const out = cloneItems(items, k, k); change(()=> B.items.push(...out)); setSel(out.map(i=> i.id)); }
function copySel(cut){ const items = selItems(); if(!items.length) return; clipboard = { items: clone(items) }; toast(cut ? 'Cortado' : 'Copiado'); if(cut) delSel(); }
function paste(at){
  if(!clipboard) return;
  const u = unionBox(clipboard.items), c = at || viewCenter();
  const out = cloneItems(clipboard.items, c.x - (u.x + u.w/2), c.y - (u.y + u.h/2));
  change(()=> B.items.push(...out)); setSel(out.map(i=> i.id));
}
function reorder(mode){
  const ids = new Set(sel);
  change(()=>{
    const moving = B.items.filter(i=> ids.has(i.id)), rest = B.items.filter(i=> !ids.has(i.id));
    if(mode === 'front') B.items = rest.concat(moving);
    else if(mode === 'back') B.items = moving.concat(rest);
    else {
      const arr = B.items.slice(), dir = mode === 'up' ? 1 : -1;
      const idxs = arr.map((it, i)=> ids.has(it.id) ? i : -1).filter(i=> i >= 0);
      (dir > 0 ? idxs.reverse() : idxs).forEach(i=>{ const j = i + dir; if(j >= 0 && j < arr.length && !ids.has(arr[j].id)){ [arr[i], arr[j]] = [arr[j], arr[i]]; } });
      B.items = arr;
    }
  });
}
function alignSel(how){
  const items = selItems().filter(i=> !isLine(i)); if(items.length < 2) return;
  const u = unionBox(items);
  change(()=> items.forEach(it=>{
    const b = aabb(it);
    if(how === 'l') it.x += u.x - b.x; if(how === 'r') it.x += u.x + u.w - (b.x + b.w); if(how === 'ch') it.x += u.x + u.w/2 - (b.x + b.w/2);
    if(how === 't') it.y += u.y - b.y; if(how === 'b') it.y += u.y + u.h - (b.y + b.h); if(how === 'cv') it.y += u.y + u.h/2 - (b.y + b.h/2);
  }));
}
function distribute(axis){
  const items = selItems().filter(i=> !isLine(i)); if(items.length < 3) return;
  const k = axis === 'h' ? 'x' : 'y', d = axis === 'h' ? 'w' : 'h';
  const sorted = items.slice().sort((a, b)=> aabb(a)[k] - aabb(b)[k]);
  const first = aabb(sorted[0]), last = aabb(sorted[sorted.length - 1]);
  const total = sorted.reduce((s, it)=> s + aabb(it)[d], 0), gap = (last[k] + last[d] - first[k] - total) / (sorted.length - 1);
  change(()=>{ let pos = first[k]; sorted.forEach(it=>{ const b = aabb(it); it[k] += pos - b[k]; pos += b[d] + gap; }); });
}
function onCtx(a, btn){
  const items = selItems(), one = items.length === 1 ? items[0] : null;
  if(a === 'unlock'){ change(()=> items.forEach(i=> i.lock = false)); return; }
  if(a === 'done'){ stopEdit(); return; }
  if(a === 'open'){ openRecipe(one.rid); return; }
  if(a === 'openlink'){ window.open(one.url, '_blank', 'noopener'); return; }
  if(a === 'editlink'){ askLink(one); return; }
  if(a === 'edit'){ startEdit(one.id); return; }
  if(a === 'info'){
    openMenu(btn, `<div class="pz-mh">Descripción · se ve al tocarlo en el esquema</div><div style="padding:4px 6px"><textarea class="pz-in" rows="7" style="resize:vertical;font:inherit;line-height:1.45">${esc(one.info || '')}</textarea></div><div class="pz-row"><button data-m="ok" class="on">Hecho</button></div>`,
      m=>{ if(m !== 'ok') return; const v = $('textarea', menuEl).value.trim(); closeMenu(); change(()=>{ if(v) one.info = v; else delete one.info; }); },
      { onMount: m=>{ m.style.width = 'min(420px, calc(100vw - 20px))'; const t = $('textarea', m); if(matchMedia('(pointer:fine)').matches) t.focus(); } });
    return;
  }
  if(a === 'dup') return duplicate();
  if(a === 'copy') return copySel();
  if(a === 'del') return delSel();
  if(a === 'color'){
    const it = items[0];
    const list = it.t === 'rec' ? REC_COLORS : it.t === 'note' ? NOTE_COLORS : it.t === 'shape' ? SHAPE_COLORS : it.t === 'text' ? TEXT_COLORS : INK_COLORS.concat(['#ff9500','#af52de','#8e8e93','#ffffff']);
    const apply = c=> change(()=> items.forEach(i=>{ if(i.t === 'note' || i.t === 'shape' || i.t === 'rec') i.fill = c; else { i.color = c; } if(i.t === 'note') S.ui.noteColor = c; }));
    openMenu(btn, swatches(list, colorOf(it), 'c'), m=>{ apply(m.slice(2)); closeMenu(); }, { onMount: m=> $('input[type=color]', m).addEventListener('input', e=> apply(e.target.value)) });
    return;
  }

function tableOp(it, m){

/* ---------- gestos ---------- */
const ptrs = new Map();       // pointerId -> {x,y,type}

let drawing = null;           // trazo en curso

}
function hitItem(e){

function onDown(e){

    if(drawing && drawing.type === 'touch'){ drawing = null; $('#pz-live', root).innerHTML = ''; }

    clearTimeout(longT); marquee = null; guides = [];

    gest = { kind: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, z0: V().z, m0: { x: (a.x + b.x)/2, y: (a.y + b.y)/2 }, v0: Object.assign({}, V()) };
    ctxHidden = true; drawUI();
    return;
  }
  if(ptrs.size > 1) return;
  if(VIEW()){
    const fb = e.target.closest('[data-h^="fold:"]');
    if(fb){ gest = { kind: 'vfold', id: fb.dataset.h.slice(5), sx: e.clientX, sy: e.clientY }; return; }
    const vi = hitItem(e);
    gest = vi ? { kind: 'vtap', id: vi.id, sx: e.clientX, sy: e.clientY } : { kind: 'pan', sx: e.clientX, sy: e.clientY, v0: Object.assign({}, V()), hist: [{ x: e.clientX, y: e.clientY, t: performance.now() }], moved: false };
    return;
  }
  if(editing){
    const it = hitItem(e);

}
function onMove(e){

    const t = [...ptrs.values()].filter(q=> q.type === 'touch'); if(t.length < 2) return;

    const wx = (gest.m0.x - r.left - v0.x) / v0.z, wy = (gest.m0.y - r.top - v0.y) / v0.z;

    marquee = { x: Math.min(x1, x2), y: Math.min(y1, y2), w: Math.abs(x2 - x1), h: Math.abs(y2 - y1) };
    const a = toWorld(Math.min(gest.sx, e.clientX), Math.min(gest.sy, e.clientY)), b = toWorld(Math.max(gest.sx, e.clientX), Math.max(gest.sy, e.clientY));
    const hit = B.items.filter(it=>{ const q = aabb(it); return q.x < b.x && q.x + q.w > a.x && q.y < b.y && q.y + q.h > a.y; }).map(i=> i.id);

  }

    if(Math.hypot(e.clientX - gest.sx, e.clientY - gest.sy) < 8) return;

}
function onUp(e){

    if([...ptrs.values()].filter(q=> q.type === 'touch').length < 2){ gest = null; ctxHidden = false; saveViewSoon(); drawUI(); }
    return;
  }
  if(ptrs.size) return;
  const g = gest; gest = null;
  if(g.kind === 'vtap'){ viewTap(g.id); return; }
  if(g.kind === 'vfold'){ toggleFold(g.id); return; }
  if(g.kind === 'pan' && !g.moved && VIEW()){ closeInfo(); return; }
  if(g.kind === 'pan'){
    if(!g.moved){ // toque en el fondo: quitar selección (y doble toque: nota nueva, como en Freeform)
      const now = performance.now(), w = toWorld(e.clientX, e.clientY);
      if(now - lastTap.t < 320 && !lastTap.id && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30){ lastTap.t = 0; addText(w); return; }

let inertiaRaf = 0;
function inertia(vx, vy){

    V().x += vx; V().y += vy; applyView(); inertiaRaf = requestAnimationFrame(step);

}
function tapItem(g, e){

  if(dbl){
    lastTap.t = 0;
    if(it.t === 'table'){ const c = e.target.closest('.cell'); startEdit(it.id, c ? { r: +c.dataset.r, c: +c.dataset.c } : null); return; }
    if(['note','text','shape'].includes(it.t)){ startEdit(it.id); return; }
    if(it.t === 'link'){ window.open(it.url, '_blank', 'noopener'); return; }
  }
}

/* --- mover --- */
function startMove(w0){
  begin();
  const ids = sel.slice();
  const lines = B.items.filter(i=> isLine(i) && ids.includes(i.id));
  gest = { kind: 'move', w0, ids, orig: clone(selItems()), box0: unionBox(selItems().filter(i=> !isLine(i))) || unionBox(selItems()), lines };
  ctxHidden = true;
}
function restoreMove(){ if(gest && gest.orig){ gest.orig.forEach(o=>{ const i = B.items.findIndex(x=> x.id === o.id); if(i >= 0) B.items[i] = clone(o); }); render(); } gest = null; snapBefore = null; }
function doMove(e){
  const w = toWorld(e.clientX, e.clientY), z = V().z;
  let dx = w.x - gest.w0.x, dy = w.y - gest.w0.y;
  // guías de alineación y cuadrícula
  guides = [];
  const b0 = gest.box0;
  if(b0 && B.opts.guides !== false){
    const ids = new Set(gest.ids);
    const others = B.items.filter(i=> !ids.has(i.id) && !isLine(i)).map(aabb);
    const vis = visibleRect(); const near = others.filter(o=> o.x < vis.x + vis.w && o.x + o.w > vis.x && o.y < vis.y + vis.h && o.y + o.h > vis.y);
    const mb = { x: b0.x + dx, y: b0.y + dy, w: b0.w, h: b0.h };
    let bestX = null, bestY = null;
    const xs = [mb.x, mb.x + mb.w/2, mb.x + mb.w], ys = [mb.y, mb.y + mb.h/2, mb.y + mb.h];
    near.forEach(o=>{
      [o.x, o.x + o.w/2, o.x + o.w].forEach(ox=> xs.forEach(mx=>{ const d = ox - mx; if(Math.abs(d)*z < SNAP && (!bestX || Math.abs(d) < Math.abs(bestX.d))) bestX = { d, x: ox, o }; }));

    });
    if(bestX){ dx += bestX.d; const y1 = Math.min(bestX.o.y, mb.y), y2 = Math.max(bestX.o.y + bestX.o.h, mb.y + mb.h); const s1 = toScreen(bestX.x, y1), s2 = toScreen(bestX.x, y2); guides.push({ x1: s1.x, y1: s1.y, x2: s1.x + 1, y2: s2.y }); }
    if(bestY){ dy += bestY.d; const x1 = Math.min(bestY.o.x, mb.x), x2 = Math.max(bestY.o.x + bestY.o.w, mb.x + mb.w); const s1 = toScreen(x1, bestY.y), s2 = toScreen(x2, bestY.y); guides.push({ x1: s1.x, y1: s1.y, x2: s2.x, y2: s1.y + 1 }); }

/* --- tiradores: redimensionar, girar, extremos de línea, conectores, tabla --- */
function startHandle(e, h){

  if(h === 'unlock'){ change(()=> items.forEach(i=> i.lock = false)); return; }
  if(h === 'addrow' || h === 'addcol'){ tableOp(items[0], h); return; }
  begin();
  const w = toWorld(e.clientX, e.clientY);

}

    const s = Math.round(ang / 45) * 45; if(Math.abs(ang - s) < 4) ang = s; // se pega a 0°, 45°, 90°…

  }

  const b = gest.box0, one = items.length === 1 ? gest.orig[0] : null, rot = one ? (one.r || 0) * Math.PI / 180 : 0;
  const c = { x: b.x + b.w/2, y: b.y + b.h/2 };
  const loc = p=>{ const dx = p.x - c.x, dy = p.y - c.y; return { x: dx*Math.cos(-rot) - dy*Math.sin(-rot), y: dx*Math.sin(-rot) + dy*Math.cos(-rot) }; };
  const p = loc(w), p0 = loc(gest.w0);
  let L = -b.w/2, R = b.w/2, T = -b.h/2, Bt = b.h/2;
  if(h.includes('w')) L += p.x - p0.x; if(h.includes('e')) R += p.x - p0.x;

  const minS = 12 / V().z;
  // esquinas: mantener proporción en fotos, recetas, tinta y grupos (y con Mayús en todo)
  const keep = (h.length === 2) && (!one || ['img','ink','rec','link'].includes(one.t) || (one.t === 'shape' && ['circle','square','star','pentagon','hexagon'].includes(one.kind)) || e.shiftKey);

  } else {

}
function endHandle(e, g){

      c.x = g.last.x - bb.w/2; c.y = g.last.y - bb.h/2; c.r = 0; delete c.g;

    }

function dropTarget(e, exceptId){

let dropEl = null;
function highlightDrop(it){

/* ---------- dibujar ---------- */
function toolSize(k){ return (S.ui.sizes && S.ui.sizes[k]) || TOOLS[k].size; }
function startDraw(e){
  const tool = S.ui.tool;
  if(sel.length) setSel([]);
  if(tool === 'goma'){ begin(); drawing = { pid: e.pointerId, type: e.pointerType, erase: true }; eraseAt(e); return; }
  const w = toWorld(e.clientX, e.clientY);
  drawing = { pid: e.pointerId, type: e.pointerType, tool, color: S.ui.color, size: toolSize(tool), pts: [[w.x, w.y, e.pointerType === 'pen' ? (e.pressure || .5) : .5]] };
  ctxHidden = true; liveDraw();
}
function moveDraw(e){
  if(drawing.erase){ eraseAt(e); return; }
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  (evs.length ? evs : [e]).forEach(ev=>{
    const w = toWorld(ev.clientX, ev.clientY), last = drawing.pts[drawing.pts.length - 1];
    if(Math.hypot(w.x - last[0], w.y - last[1]) * V().z < 1.2) return;
    drawing.pts.push([w.x, w.y, ev.pointerType === 'pen' ? (ev.pressure || .5) : .5]);
  });
  liveDraw();
}
function liveDraw(){
  const t = TOOLS[drawing.tool], v = V();
  $('#pz-live', root).innerHTML = `<svg style="position:absolute;inset:0;width:100%;height:100%;overflow:visible${t.hl ? ';mix-blend-mode:multiply' : ''}"><g transform="translate(${v.x},${v.y}) scale(${v.z})"><path d="${inkPath(drawing.pts, drawing.size, t.pressure)}" fill="${drawing.color}" fill-opacity="${t.op}"/></g></svg>`;
}
function endDraw(){
  const d = drawing; drawing = null; ctxHidden = false;
  $('#pz-live', root).innerHTML = ''; eraserDot = null;
  if(d.erase){ commit(); render(); return; }
  let pts = d.pts;
  // un trazo recto con el subrayador se queda recto
  if(TOOLS[d.tool].hl && pts.length > 2){ const a = pts[0], b = pts[pts.length - 1], L = Math.hypot(b[0]-a[0], b[1]-a[1]); const dev = Math.max(...pts.map(p=> Math.abs((b[0]-a[0])*(a[1]-p[1]) - (a[0]-p[0])*(b[1]-a[1])) / (L || 1))); if(dev < 6 / V().z) pts = [a, b]; }
  addInk(pts, d.tool, d.color, d.size);
  drawUI();
}
function addInk(pts, tool, color, size){
  const pad = size;
  const xs = pts.map(p=> p[0]), ys = pts.map(p=> p[1]);
  const x = Math.min(...xs) - pad, y = Math.min(...ys) - pad, w = Math.max(...xs) - x + pad, h = Math.max(...ys) - y + pad;
  const local = pts.map(p=> [+(p[0] - x).toFixed(2), +(p[1] - y).toFixed(2), +(p[2] || .5).toFixed(2)]);
  const it = { id: 'i' + uid(), t: 'ink', tool, color, size, x, y, w, h, w0: w, h0: h, pts: local };
  it.d = inkPath(local, size, TOOLS[tool].pressure);
  begin(); B.items.push(it); commit(); render();
  return it;
}
/* puntos de un trazo en coordenadas de la pizarra */
function inkWorld(it){ const sx = it.w / it.w0, sy = it.h / it.h0; return it.pts.map(p=> [it.x + p[0]*sx, it.y + p[1]*sy, p[2]]); }
function eraseAt(e){
  const w = toWorld(e.clientX, e.clientY), r = 10 / V().z, rp = vp.getBoundingClientRect();
  eraserDot = { x: e.clientX - rp.left, y: e.clientY - rp.top, r: 10 };
  const byObj = S.ui.eraserMode === 'obj';
  let changed = false;
  B.items.slice().forEach(it=>{
    if(it.t !== 'ink' || it.lock) return;
    const b = aabb(it); if(w.x < b.x - r || w.x > b.x + b.w + r || w.y < b.y - r || w.y > b.y + b.h + r) return;
    const P = inkWorld(it), hitR = r + it.size * (it.w / it.w0) * .5;
    const near = P.map(p=> Math.hypot(p[0] - w.x, p[1] - w.y) < hitR);
    // también entre puntos lejanos (trazos rectos del subrayador)
    for(let i = 1; i < P.length; i++){ if(!near[i] && !near[i-1] && segDist(w, P[i-1], P[i]) < hitR){ near[i] = near[i-1] = true; } }
    if(!near.some(Boolean)) return;
    changed = true;
    const idx = B.items.indexOf(it);
    B.items.splice(idx, 1);
    if(byObj) return;
    // goma de píxeles: el trazo se parte en los trozos que quedan
    let run = [], pieces = [];
    P.forEach((p, i)=>{ if(near[i]){ if(run.length > 1) pieces.push(run); run = []; } else run.push(p); });
    if(run.length > 1) pieces.push(run);
    pieces.forEach(pc=>{
      const pad = it.size, xs = pc.map(p=> p[0]), ys = pc.map(p=> p[1]);
      const x = Math.min(...xs) - pad, y = Math.min(...ys) - pad, ww = Math.max(...xs) - x + pad, hh = Math.max(...ys) - y + pad;
      const local = pc.map(p=> [p[0] - x, p[1] - y, p[2]]);
      const n = { id: 'i' + uid(), t: 'ink', tool: it.tool, color: it.color, size: it.size * (it.w / it.w0), x, y, w: ww, h: hh, w0: ww, h0: hh, pts: local, g: it.g };
      n.d = inkPath(local, n.size, TOOLS[n.tool].pressure);
      B.items.splice(idx, 0, n);
    });
  });
  if(changed) render(); else drawUI();
}
function segDist(p, a, b){
  const dx = b[0] - a[0], dy = b[1] - a[1], L = dx*dx + dy*dy;
  let t = L ? ((p.x - a[0])*dx + (p.y - a[1])*dy) / L : 0; t = clamp(t, 0, 1);
  return Math.hypot(p.x - (a[0] + t*dx), p.y - (a[1] + t*dy));
}

    if(isLine(it)) return `<path d="${linePathData(it).d}" stroke="${it.color||'#1c1c1e'}" stroke-width="${(it.sw||2.5)*2}" fill="none"/>`;
    const b = box(it), fill = it.t === 'note' ? (it.fill || NOTE_COLORS[0]) : it.t === 'shape' ? (it.fill || '#5ab4f0') : it.t === 'text' ? 'none' : it.t === 'rec' ? (it.fill || '#fff') : '#fff';

function drawSceneNav(){

    : `<p style="opacity:.6;font-size:14.5px;padding:6px 4px 2px;line-height:1.4">Coloca la vista (zoom y posición) sobre una parte de la pizarra y guárdala como escena para volver a ella con un toque.</p>`) +
    `<button class="pz-add" data-s="add"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 8.5v7M8.5 12h7"/></svg>Añadir escena</button>`;

function closeScenes(){ const p = $('#pz-scenes', root); if(p) p.remove(); }
function onScenes(e){
  const b = e.target.closest('[data-s]'); if(!b) return;

  if(s === 'add'){ B.scenes.push(Object.assign({ id: 's' + uid(), name: 'Escena ' + (B.scenes.length + 1) }, captureScene())); sceneIdx = B.scenes.length - 1; save(); drawScenesPanel(); drawSceneNav(); return; }

  if(s === 'up' && i > 0){ [B.scenes[i-1], B.scenes[i]] = [B.scenes[i], B.scenes[i-1]]; save(); drawScenesPanel(true); return; }
  if(s === 'down' && i < B.scenes.length - 1){ [B.scenes[i+1], B.scenes[i]] = [B.scenes[i], B.scenes[i+1]]; save(); drawScenesPanel(true); return; }

    const sc = B.scenes[i];
    openMenu(b, `<button class="pz-mi" data-m="go">Ir a la escena</button><button class="pz-mi" data-m="rename">Renombrar</button><button class="pz-mi" data-m="replace">Reemplazar con la vista actual</button><button class="pz-mi danger" data-m="del">Eliminar escena</button>`,
      m=>{ closeMenu();
        if(m === 'go') goScene(i);
        if(m === 'rename'){ const n = prompt('Nombre de la escena', sc.name); if(n && n.trim()){ sc.name = n.trim(); save(); drawScenesPanel(); } }
        if(m === 'replace'){ Object.assign(sc, captureScene()); save(); drawScenesPanel(); toast('Escena actualizada'); }
        if(m === 'del'){ B.scenes.splice(i, 1); sceneIdx = -1; save(); drawScenesPanel(); drawSceneNav(); }
      });
    return;
  }
  if(s === 'more'){
    openMenu(b, `<button class="pz-mi" data-m="pdf">${IC.pdf}Imprimir o guardar escenas en PDF</button>`, m=>{ closeMenu(); if(m === 'pdf') printBoard(true); });
  }
}
